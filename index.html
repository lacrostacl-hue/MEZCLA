<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Alegria - Mezcladora Web Profesional</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0 0 50px 0; 
        }
        
        .header-title { padding: 10px; }
        .header-title h1 { margin-bottom: 0; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; font-size: 1.6em; margin-top:0; }
        .header-title p.subtitle { color: #aaa; margin-bottom: 5px; font-size: 0.9em; }

        /* ==========================================================
           CABINA FIJA REDUCIDA (COMPACTA)
           ========================================================== */
        .cabina-sticky {
            position: sticky;
            top: 0;
            background-color: #121212; 
            z-index: 1000; 
            padding: 10px 0;
            border-bottom: 2px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8); 
            margin-bottom: 20px;
        }
        
        .dj-booth {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Menos espacio entre componentes */
            flex-wrap: wrap;
        }

        .deck-container {
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            width: 220px; /* Más delgado */
        }

        h2 { margin: 0 0 10px 0; color: #fff; font-size: 1.1em; }
        .title-pedidos { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); font-size: 1.4em;}

        /* Vinilos más pequeños */
        .deck {
            background: #000;
            border: 8px solid #333;
            border-radius: 50%;
            width: 150px; /* Reducido */
            height: 150px;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: transform 0.1s linear;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }

        .video-container {
            width: 100px; /* Reducido */
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .controls { margin-top: 15px; }
        .controls button {
            background: #00ffcc; color: #000; border: none;
            padding: 8px 15px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 12px;
            transition: 0.2s;
        }
        .controls button:hover { background: #00cca3; transform: scale(1.05); }

        .mixer-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #444;
            width: 160px;
        }
        
        input[type=range] { width: 130px; margin: 10px 0; cursor: pointer; accent-color: #00ffcc; }

        /* ==========================================================
           LISTAS, ACORDEONES Y COLORES DE "TOCADA"
           ========================================================== */
        .playlists-container {
            display: flex; justify-content: center; gap: 20px;
            max-width: 1200px; margin: 0 auto; flex-wrap: wrap;
            align-items: flex-start; padding: 0 20px;
        }

        .playlist {
            flex: 1; min-width: 350px; background: #1e1e1e;
            padding: 20px; border-radius: 10px; text-align: left;
            border: 1px solid #333;
        }
        .playlist.pedidos-box { border-color: #554400; background: #1a170d; }
        
        .categoria-btn {
            background-color: #00ffcc; color: #000; padding: 12px 15px; margin: 10px 0 0 0;
            font-weight: bold; border-radius: 5px; text-transform: uppercase;
            width: 100%; text-align: left; border: none; cursor: pointer;
            font-size: 14px; display: flex; justify-content: space-between;
            align-items: center; transition: 0.2s;
        }
        .categoria-btn:hover { background-color: #00cca3; }
        
        .categoria-content {
            display: none; background: #151515; border: 1px solid #333;
            border-top: none; border-radius: 0 0 5px 5px; padding: 5px;
        }

        .song-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #222; transition: 0.2s;
        }
        .song-item:hover { background: #2a2a2a; }
        
        /* 🔥 ESTILO PARA CANCIONES YA TOCADAS 🔥 */
        .song-item.played {
            background-color: #3d0a0a !important; 
            border-left: 5px solid #ff3333;
        }
        .song-item.played .song-title { color: #ff8888; }
        .song-item.played .song-meta { color: #ff6666; text-decoration: line-through; }

        .song-info { display: flex; flex-direction: column; }
        .song-title { font-size: 14px; font-weight: bold; }
        .song-meta { font-size: 11px; color: #00ffcc; margin-top: 4px; }
        .pedidos-box .song-meta { color: #ffcc00; }
        
        .load-buttons button { margin-left: 8px; font-size: 11px; padding: 6px 12px; background: #444; color: white; border: none; border-radius:4px; cursor:pointer;}
        .load-buttons button:hover { background: #666; }
        .load-buttons .btn-a:hover { background: #ff0055; }
        .load-buttons .btn-b:hover { background: #0088ff; }

        /* Buscador y Pedidos */
        .input-pedido-container { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .input-pedido-container input, .input-pedido-container select { 
            flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #444; 
            background: #111; color: #fff; min-width: 120px;
        }
        .btn-pedido { background: #ffcc00; color: #000; padding: 8px 15px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;}
        .btn-pedido:hover { background: #e6b800; }
        .divisor { height: 1px; background: #554400; margin: 15px 0; }
        .etiqueta-pequena { font-size: 12px; color: #aaa; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>📻 Radio Web: Cabina Profesional DJ</h1>
        <p class="subtitle">Cabina Compacta Fija + Marcador Rojo de Tocadas</p>
    </div>

    <!-- CABINA STICKY (Se queda fija arriba, ahora es más pequeña) -->
    <div class="cabina-sticky">
        <div class="dj-booth">
            <!-- DECK A -->
            <div class="deck-container">
                <h2 style="color: #ff0055;">DECK A</h2>
                <div class="deck" id="deckA">
                    <div class="video-container">
                        <div id="playerA"></div>
                    </div>
                </div>
                <div class="controls">
                    <button onclick="togglePlay('A')" style="background: #ff0055; color: white;">▶️ Play / ⏸️ Pause A</button>
                </div>
            </div>

            <!-- CROSSFADER -->
            <div class="mixer-controls">
                <h3>Crossfader</h3>
                <span style="font-size: 11px; color: #888;">A &lt;=====&gt; B</span>
                <input type="range" id="crossfader" min="0" max="100" value="50" oninput="updateVolumes()">
            </div>

            <!-- DECK B -->
            <div class="deck-container">
                <h2 style="color: #0088ff;">DECK B</h2>
                <div class="deck" id="deckB">
                    <div class="video-container">
                        <div id="playerB"></div>
                    </div>
                </div>
                <div class="controls">
                    <button onclick="togglePlay('B')" style="background: #0088ff; color: white;">▶️ Play / ⏸️ Pause B</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DE LAS DOS LISTAS -->
    <div class="playlists-container">
        
        <!-- LISTA PRINCIPAL -->
        <div class="playlist">
            <h2 style="font-size: 1.4em;">🎵 Setlist Principal</h2>
            <div id="tracklist">
                <!-- Se inyecta con JS agrupado por botones -->
            </div>
        </div>

        <!-- LISTA DE PEDIDOS Y BÚSQUEDA -->
        <div class="playlist pedidos-box">
            <h2 class="title-pedidos">🎤 Buscador y Guardado</h2>
            
            <span class="etiqueta-pequena">Paso 1: Busca la canción en YouTube</span>
            <div class="input-pedido-container">
                <input type="text" id="inputBuscar" placeholder="Ej: Daddy Yankee Gasolina..." onkeypress="handleEnterSearch(event)">
                <button class="btn-pedido" onclick="buscarEnYouTube()" style="background: #ff0000; color: white;">🔍 Buscar en YT</button>
            </div>

            <div class="divisor"></div>

            <span class="etiqueta-pequena">Paso 2: Pega el enlace y guárdalo en una categoría</span>
            <div class="input-pedido-container">
                <input type="text" id="inputUrl" placeholder="Pega el enlace de YT..." style="min-width: 100%;">
                <input type="text" id="inputNombre" placeholder="Nombre (Ej: Gasolina)">
                
                <!-- ESTE ES EL NUEVO SELECTOR PARA GUARDAR ORDENADO -->
                <select id="selectCategoriaPedido">
                    <!-- Se llena automáticamente con JS -->
                </select>

                <button class="btn-pedido" onclick="agregarPedido()">➕ Añadir</button>
            </div>

            <!-- Lista exclusiva para "Pedidos en vivo" que no quisiste guardar en categorías -->
            <div id="tracklist-pedidos" style="margin-top: 15px;"></div>
        </div>

    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let playerA, playerB;
        let contadorPedidos = 1;

        // Base de Datos Ampliada con nuevos géneros Latinos
        const tracks = [
            // 🕺 70s DISCO
            { id: '3cQNkIrg-Tk', artist: 'Earth, Wind & Fire - September', bpm: 125, decade: '70s Disco' },
            { id: 'QRoWiTcO7dI', artist: 'ABBA - Dancing Queen', bpm: 100, decade: '70s Disco' },
            // 🎹 80s POP
            { id: 'djV11Xbc914', artist: 'A-ha - Take On Me', bpm: 169, decade: '80s Pop' },
            { id: 'Zi_XLOBDo_Y', artist: 'Michael Jackson - Billie Jean', bpm: 117, decade: '80s Pop' },
            // 💿 90s EURODANCE
            { id: 'HEXWRTEbj1I', artist: 'Haddaway - What Is Love', bpm: 124, decade: '90s Eurodance' },
            { id: 'zWaymcVmJ-A', artist: 'Los del Río - Macarena', bpm: 103, decade: '90s Eurodance' },
            // 🎛️ 2000s CLUB
            { id: 'PWgvGjAhvIw', artist: 'Outkast - Hey Ya!', bpm: 160, decade: '2000s Club' },
            // 🌟 ACTUALIDAD
            { id: 'oygrmJFKYZY', artist: 'Dua Lipa - Don\'t Start Now', bpm: 124, decade: 'Actualidad' },
            
            // 🔥 NUEVOS GÉNEROS 🔥
            // REGGAETON
            { id: 'qGKrc3A6HHM', artist: 'Daddy Yankee - Gasolina', bpm: 96, decade: 'Reggaeton' },
            { id: '7zp1TbLFPp8', artist: 'Don Omar - Danza Kuduro', bpm: 130, decade: 'Reggaeton' },
            // SALSA
            { id: 'YXnjy5YlDwk', artist: 'Marc Anthony - Vivir Mi Vida', bpm: 105, decade: 'Salsa' },
            { id: 'l-Kswx9L-m8', artist: 'Celia Cruz - La Vida Es Un Carnaval', bpm: 104, decade: 'Salsa' },
            // MERENGUE
            { id: 'WPiEbYSF9kE', artist: 'Elvis Crespo - Suavemente', bpm: 155, decade: 'Merengue' },
            { id: '9BymE14_oAA', artist: 'Proyecto Uno - El Tiburon', bpm: 125, decade: 'Merengue' },
            // ROMÁNTICOS EN ESPAÑOL
            { id: 'V1bFr2SWP1I', artist: 'Chayanne - Dejaría Todo', bpm: 80, decade: 'Románticos' },
            { id: 'h7JvF_uXG5c', artist: 'Luis Miguel - La Incondicional', bpm: 85, decade: 'Románticos' }
        ];

        // =========================================================
        // RENDERIZAR LISTAS Y SELECTOR
        // =========================================================
        function renderizarBaseDatos() {
            const tracklistDiv = document.getElementById('tracklist');
            const selectDiv = document.getElementById('selectCategoriaPedido');
            
            const estilos = [...new Set(tracks.map(t => t.decade))];
            let htmlFinal = '';
            let htmlSelect = '';

            estilos.forEach((estilo, index) => {
                let catId = 'cat-' + index;
                let estadoInicial = index === 0 ? 'block' : 'none';
                let flechaInicial = index === 0 ? '▲' : '▼';
                
                // Llenamos el menú desplegable (Select)
                htmlSelect += `<option value="${catId}">${estilo}</option>`;

                let cancionesEstilo = tracks.filter(t => t.decade === estilo).sort((a, b) => a.bpm - b.bpm);

                htmlFinal += `
                    <button class="categoria-btn" onclick="toggleCategoria('${catId}')">
                        <span>📂 ${estilo}</span>
                        <span id="icon-${catId}">${flechaInicial}</span>
                    </button>
                    <div id="${catId}" class="categoria-content" style="display: ${estadoInicial};">
                `;

                cancionesEstilo.forEach(track => {
                    htmlFinal += generarHtmlCancion(track);
                });
                
                htmlFinal += `</div>`;
            });

            tracklistDiv.innerHTML = htmlFinal;
            // Agregamos opción extra para dejarlo suelto
            selectDiv.innerHTML = htmlSelect + `<option value="cat-pedidos">⭐ Lista Temporal de Pedidos</option>`;
        }

        // Función para generar la caja de la canción y vincular el ID
        function generarHtmlCancion(track, esPedido = false) {
            return `
                <div class="song-item" data-id="${track.id}" ${esPedido ? 'style="background-color: #332b00; border-color: #554400;"' : ''}>
                    <div class="song-info">
                        <span class="song-title">${track.artist}</span>
                        <span class="song-meta">⚡ ${track.bpm === '?' ? '?' : track.bpm} BPM</span>
                    </div>
                    <div class="load-buttons">
                        <button class="btn-a" onclick="loadVideo('A', '${track.id}')">Deck A</button>
                        <button class="btn-b" onclick="loadVideo('B', '${track.id}')">Deck B</button>
                    </div>
                </div>
            `;
        }

        renderizarBaseDatos();

        function toggleCategoria(catId) {
            let contenido = document.getElementById(catId);
            let icono = document.getElementById('icon-' + catId);
            
            if (contenido.style.display === 'none') {
                contenido.style.display = 'block'; icono.innerText = '▲';
            } else {
                contenido.style.display = 'none'; icono.innerText = '▼';
            }
        }

        // =========================================================
        // BUSCADOR Y AÑADIDO INTELIGENTE
        // =========================================================
        function buscarEnYouTube() {
            const query = document.getElementById('inputBuscar').value.trim();
            if (query) window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            else alert("Escribe el nombre de una canción para buscar.");
        }

        function handleEnterSearch(event) { if (event.key === 'Enter') buscarEnYouTube(); }

        function extraerIDYouTube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        // Guarda la canción en el bloque seleccionado
        function agregarPedido() {
            const url = document.getElementById('inputUrl').value.trim();
            let nombre = document.getElementById('inputNombre').value.trim();
            const catSeleccionada = document.getElementById('selectCategoriaPedido').value;
            
            if (!url) return alert("Pega un enlace de YouTube.");
            const videoId = extraerIDYouTube(url);
            if (!videoId) return alert("Enlace inválido.");
            if (!nombre) nombre = "Audio Nuevo " + contadorPedidos;

            const nuevaCancion = { id: videoId, artist: nombre, bpm: '?' };
            const htmlCancion = generarHtmlCancion(nuevaCancion, catSeleccionada === 'cat-pedidos');

            if (catSeleccionada === 'cat-pedidos') {
                // Va a la lista separada abajo
                const listaPedidos = document.getElementById('tracklist-pedidos');
                listaPedidos.innerHTML = htmlCancion + listaPedidos.innerHTML;
            } else {
                // Va a la carpeta correspondiente e inyecta la canción al principio del bloque
                const contenedorCat = document.getElementById(catSeleccionada);
                contenedorCat.innerHTML = htmlCancion + contenedorCat.innerHTML;
                
                // Si la carpeta estaba cerrada, ábrela para que veas que se agregó
                if(contenedorCat.style.display === 'none') {
                    toggleCategoria(catSeleccionada);
                }
            }

            document.getElementById('inputUrl').value = '';
            document.getElementById('inputNombre').value = '';
            contadorPedidos++;
        }

        // =========================================================
        // REPRODUCTORES Y DETECTOR ROJO "YA TOCADO"
        // =========================================================
        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '300', width: '300',
                videoId: tracks[0].id, 
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'A') }
            });
            playerB = new YT.Player('playerB', {
                height: '300', width: '300',
                videoId: tracks[1].id,
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'B') }
            });
        }

        function onPlayerReady() { updateVolumes(); }

        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'A' ? 'deckA' : 'deckB');
            if (event.data === YT.PlayerState.PLAYING) deckElement.classList.add('spinning');
            else deckElement.classList.remove('spinning');
        }

        function loadVideo(deck, videoId) {
            // Cargar en el reproductor
            if (deck === 'A') playerA.cueVideoById(videoId);
            else playerB.cueVideoById(videoId);

            // 🔥 MARCAR LA CANCIÓN DE COLOR ROJO PORQUE YA SE CARGÓ 🔥
            const etiquetasCancion = document.querySelectorAll(`.song-item[data-id="${videoId}"]`);
            etiquetasCancion.forEach(el => {
                el.classList.add('played');
            });
        }

        function togglePlay(deck) {
            let p = deck === 'A' ? playerA : playerB;
            if (p.getPlayerState() === 1) p.pauseVideo();
            else p.playVideo();
        }

        function updateVolumes() {
            if (!playerA || !playerB || !playerA.setVolume || !playerB.setVolume) return;
            let f = document.getElementById('crossfader').value;
            playerA.setVolume(f <= 50 ? 100 : 100 - ((f - 50) * 2));
            playerB.setVolume(f >= 50 ? 100 : f * 2);
        }
    </script>
</body>
</html>
