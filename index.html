<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Alegria - Mezcladora Web Profesional</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
        p.subtitle { color: #aaa; margin-bottom: 30px; font-size: 1.1em; }
        
        .dj-booth {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .deck-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
        }

        h2 { margin-top: 0; color: #fff; }

        /* Diseño del Vinilo */
        .deck {
            background: #000;
            border: 12px solid #333;
            border-radius: 50%;
            width: 280px;
            height: 280px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: transform 0.1s linear;
        }

        /* Animación para que el vinilo gire */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }

        .video-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .controls { margin-top: 20px; }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover { background: #00cca3; transform: scale(1.05); }

        .mixer-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2a2a2a;
            padding: 30px 20px;
            border-radius: 15px;
            border: 2px solid #444;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        input[type=range] {
            width: 250px;
            margin: 20px 0;
            cursor: pointer;
            accent-color: #00ffcc;
        }

        .playlist {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            border: 1px solid #333;
        }
        
        .tracklist-container {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .tracklist-container::-webkit-scrollbar { width: 8px; }
        .tracklist-container::-webkit-scrollbar-track { background: #111; border-radius: 4px; }
        .tracklist-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #333;
            transition: 0.2s;
        }
        .song-item:hover { background: #2a2a2a; }
        
        .song-info { display: flex; flex-direction: column; }
        .song-title { font-size: 15px; font-weight: bold; }
        .song-meta { font-size: 12px; color: #00ffcc; margin-top: 4px; }
        
        .load-buttons button { 
            margin-left: 8px; 
            font-size: 12px; 
            padding: 6px 12px; 
            background: #444; 
            color: white;
        }
        .load-buttons button:hover { background: #666; }
        .load-buttons .btn-a:hover { background: #ff0055; }
        .load-buttons .btn-b:hover { background: #0088ff; }

    </style>
</head>

        // 3. INICIALIZAMOS LA API DE YOUTUBE
        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '300', width: '300',
                videoId: tracks[0].id, 
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 
                    'onReady': onPlayerReady,
                    'onStateChange': (e) => onStateChange(e, 'A'),
                    'onError': (e) => onPlayerError(e, 'A')
                }
            });
            playerB = new YT.Player('playerB', {
                height: '300', width: '300',
                videoId: tracks[1].id,
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 
                    'onReady': onPlayerReady,
                    'onStateChange': (e) => onStateChange(e, 'B'),
                    'onError': (e) => onPlayerError(e, 'B')
                }
            });
        }

        function onPlayerReady(event) {
            updateVolumes();
        }

        // 4. ANIMACIÓN DEL VINILO GIRANDO
        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'A' ? 'deckA' : 'deckB');
            if (event.data === YT.PlayerState.PLAYING) {
                deckElement.classList.add('spinning');
            } else {
                deckElement.classList.remove('spinning');
            }
        }

        // 5. DETECTOR DE BLOQUEOS DE DISQUERAS (ERROR 150/101)
        function onPlayerError(event, deck) {
            if (event.data === 150 || event.data === 101) {
                alert(`⚠️ ALERTA DJ: El video cargado en el DECK ${deck} está bloqueado por su discográfica para reproducirse fuera de YouTube. \n\n¡Carga la siguiente canción de tu lista rápido!`);
            }
        }

        function loadVideo(deck, videoId) {
            if (deck === 'A') {
                playerA.cueVideoById(videoId);
            } else {
                playerB.cueVideoById(videoId);
            }
        }

        function togglePlay(deck) {
            if (deck === 'A') {
                let stateA = playerA.getPlayerState();
                if (stateA === 1) { playerA.pauseVideo(); } else { playerA.playVideo(); }
            } else {
                let stateB = playerB.getPlayerState();
                if (stateB === 1) { playerB.pauseVideo(); } else { playerB.playVideo(); }
            }
        }

        function updateVolumes() {
            if (!playerA || !playerA.setVolume || !playerB || !playerB.setVolume) return;
            let faderValue = document.getElementById('crossfader').value;
            let volA = faderValue <= 50 ? 100 : 100 - ((faderValue - 50) * 2);
            let volB = faderValue >= 50 ? 100 : faderValue * 2;
            playerA.setVolume(volA);
            playerB.setVolume(volB);
        }
