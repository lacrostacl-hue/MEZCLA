<head>

    <title>Radio Alegria - Mezcladora Web Profesional</title>
    <style>
        body {
            background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center; margin: 0; padding: 0 0 50px 0; 
        }
        
        .header-title { padding: 10px; }
        .header-title h1 { margin-bottom: 0; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; font-size: 1.6em; margin-top:0; }
        .header-title p.subtitle { color: #aaa; margin-bottom: 5px; font-size: 0.9em; }

        /* CABINA FIJA COMPACTA */
        .cabina-sticky {
            position: sticky; top: 0; background-color: #121212; z-index: 1000; 
            padding: 10px 0; border-bottom: 2px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.8); 
            margin-bottom: 20px;
        }
        
        .dj-booth { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .deck-container { background: #1e1e1e; padding: 10px 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); width: 220px; }
        h2 { margin: 0 0 10px 0; color: #fff; font-size: 1.1em; }
        .title-pedidos { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); font-size: 1.4em;}

        .deck {
            background: #000; border: 8px solid #333; border-radius: 50%; width: 150px; height: 150px;
            position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.1);
            overflow: hidden; display: flex; justify-content: center; align-items: center; margin: 0 auto;
            transition: transform 0.1s linear;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }

        .video-container { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; pointer-events: none; }
        .controls { margin-top: 15px; }
        .controls button { background: #00ffcc; color: #000; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; }
        .controls button:hover { background: #00cca3; transform: scale(1.05); }

        .mixer-controls { display: flex; flex-direction: column; align-items: center; background: #2a2a2a; padding: 15px; border-radius: 12px; border: 2px solid #444; width: 160px; }
        input[type=range] { width: 130px; margin: 10px 0; cursor: pointer; accent-color: #00ffcc; }

        /* LISTAS Y ACORDEONES */
        .playlists-container { display: flex; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; align-items: flex-start; padding: 0 20px; }
        .playlist { flex: 1; min-width: 350px; background: #1e1e1e; padding: 20px; border-radius: 10px; text-align: left; border: 1px solid #333; }
        .playlist.pedidos-box { border-color: #554400; background: #1a170d; }
        
        .categoria-btn { background-color: #00ffcc; color: #000; padding: 12px 15px; margin: 10px 0 0 0; font-weight: bold; border-radius: 5px; text-transform: uppercase; width: 100%; text-align: left; border: none; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .categoria-btn:hover { background-color: #00cca3; }
        .categoria-content { display: none; background: #151515; border: 1px solid #333; border-top: none; border-radius: 0 0 5px 5px; padding: 5px; }

        .song-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #222; transition: 0.2s; }
        .song-item:hover { background: #2a2a2a; }
        
        /* CANCIONES YA TOCADAS */
        .song-item.played { background-color: #3d0a0a !important; border-left: 5px solid #ff3333; }
        .song-item.played .song-title { color: #ff8888; }
        .song-item.played .song-meta { color: #ff6666; text-decoration: line-through; }

        .song-info { display: flex; flex-direction: column; }
        .song-title { font-size: 14px; font-weight: bold; }
        .song-meta { font-size: 11px; color: #00ffcc; margin-top: 4px; }
        .pedidos-box .song-meta { color: #ffcc00; }
        
        .load-buttons button { margin-left: 8px; font-size: 11px; padding: 6px 12px; background: #444; color: white; border: none; border-radius:4px; cursor:pointer;}
        .load-buttons button:hover { background: #666; }
        .load-buttons .btn-a:hover { background: #ff0055; }
        .load-buttons .btn-b:hover { background: #0088ff; }

        /* Buscador */
        .input-pedido-container { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .input-pedido-container input, .input-pedido-container select { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #111; color: #fff; min-width: 120px; }
        .btn-pedido { background: #ffcc00; color: #000; padding: 8px 15px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;}
        .btn-pedido:hover { background: #e6b800; }
        .divisor { height: 1px; background: #554400; margin: 15px 0; }
        .etiqueta-pequena { font-size: 12px; color: #aaa; margin-bottom: 5px; display: block; }
    </style>
</head>

        function renderizarBaseDatos() {
            const tracklistDiv = document.getElementById('tracklist');
            const selectDiv = document.getElementById('selectCategoriaPedido');
            const estilos = [...new Set(tracks.map(t => t.decade))];
            let htmlFinal = '';
            let htmlSelect = '';

            estilos.forEach((estilo, index) => {
                let catId = 'cat-' + index;
                let estadoInicial = index === 0 ? 'block' : 'none';
                let flechaInicial = index === 0 ? '▲' : '▼';
                
                htmlSelect += `<option value="${catId}">${estilo}</option>`;

                let cancionesEstilo = tracks.filter(t => t.decade === estilo).sort((a, b) => a.bpm - b.bpm);

                htmlFinal += `
                    <button class="categoria-btn" onclick="toggleCategoria('${catId}')">
                        <span>📂 ${estilo} (${cancionesEstilo.length} tracks)</span>
                        <span id="icon-${catId}">${flechaInicial}</span>
                    </button>
                    <div id="${catId}" class="categoria-content" style="display: ${estadoInicial};">
                `;

                cancionesEstilo.forEach(track => {
                    htmlFinal += generarHtmlCancion(track);
                });
                htmlFinal += `</div>`;
            });

            tracklistDiv.innerHTML = htmlFinal;
            selectDiv.innerHTML = htmlSelect + `<option value="cat-pedidos">⭐ Lista Temporal de Pedidos</option>`;
        }

        function generarHtmlCancion(track, esPedido = false) {
            return `
                <div class="song-item" data-id="${track.id}" ${esPedido ? 'style="background-color: #332b00; border-color: #554400;"' : ''}>
                    <div class="song-info">
                        <span class="song-title">${track.artist}</span>
                        <span class="song-meta">⚡ ${track.bpm} BPM</span>
                    </div>
                    <div class="load-buttons">
                        <button class="btn-a" onclick="loadVideo('A', '${track.id}')">Deck A</button>
                        <button class="btn-b" onclick="loadVideo('B', '${track.id}')">Deck B</button>
                    </div>
                </div>
            `;
        }

        renderizarBaseDatos();

        function toggleCategoria(catId) {
            let contenido = document.getElementById(catId);
            let icono = document.getElementById('icon-' + catId);
            if (contenido.style.display === 'none') { contenido.style.display = 'block'; icono.innerText = '▲'; } 
            else { contenido.style.display = 'none'; icono.innerText = '▼'; }
        }

        function buscarEnYouTube() {
            const query = document.getElementById('inputBuscar').value.trim();
            if (query) window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            else alert("Escribe el nombre de una canción para buscar.");
        }

        function handleEnterSearch(event) { if (event.key === 'Enter') buscarEnYouTube(); }

        function extraerIDYouTube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function agregarPedido() {
            const url = document.getElementById('inputUrl').value.trim();
            let nombre = document.getElementById('inputNombre').value.trim();
            const catSeleccionada = document.getElementById('selectCategoriaPedido').value;
            
            if (!url) return alert("Pega un enlace de YouTube.");
            const videoId = extraerIDYouTube(url);
            if (!videoId) return alert("Enlace inválido.");
            if (!nombre) nombre = "Audio Nuevo " + contadorPedidos;

            const nuevaCancion = { id: videoId, artist: nombre, bpm: '?' };
            const htmlCancion = generarHtmlCancion(nuevaCancion, catSeleccionada === 'cat-pedidos');

            if (catSeleccionada === 'cat-pedidos') {
                const listaPedidos = document.getElementById('tracklist-pedidos');
                listaPedidos.innerHTML = htmlCancion + listaPedidos.innerHTML;
            } else {
                const contenedorCat = document.getElementById(catSeleccionada);
                contenedorCat.innerHTML = htmlCancion + contenedorCat.innerHTML;
                if(contenedorCat.style.display === 'none') toggleCategoria(catSeleccionada);
            }

            document.getElementById('inputUrl').value = '';
            document.getElementById('inputNombre').value = '';
            contadorPedidos++;
        }

        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '300', width: '300',
                videoId: tracks[0].id, 
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'A') }
            });
            playerB = new YT.Player('playerB', {
                height: '300', width: '300',
                videoId: tracks[1].id,
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'B') }
            });
        }

        function onPlayerReady() { updateVolumes(); }

        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'A' ? 'deckA' : 'deckB');
            if (event.data === YT.PlayerState.PLAYING) deckElement.classList.add('spinning');
            else deckElement.classList.remove('spinning');
        }

        function loadVideo(deck, videoId) {
            if (deck === 'A') playerA.cueVideoById(videoId);
            else playerB.cueVideoById(videoId);

            const etiquetasCancion = document.querySelectorAll(`.song-item[data-id="${videoId}"]`);
            etiquetasCancion.forEach(el => { el.classList.add('played'); });
        }

        function togglePlay(deck) {
            let p = deck === 'A' ? playerA : playerB;
            if (p.getPlayerState() === 1) p.pauseVideo();
            else p.playVideo();
        }

        function updateVolumes() {
            if (!playerA || !playerB || !playerA.setVolume || !playerB.setVolume) return;
            let f = document.getElementById('crossfader').value;
            playerA.setVolume(f <= 50 ? 100 : 100 - ((f - 50) * 2));
            playerB.setVolume(f >= 50 ? 100 : f * 2);
        }
    </script>
