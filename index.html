<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Alegría - DJ Master Console Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #050608; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Consola de Mezclas Estilo Hardware Club */
        .dj-mixing-console {
            background: linear-gradient(135deg, #11141d 0%, #07090e 100%);
            border: 3px solid #1f2633;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 1px 3px rgba(255,255,255,0.1);
        }

        .cabina-sticky {
            position: sticky; top: 0; z-index: 1020;
            background: rgba(5, 6, 8, 0.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid #1a202c;
        }

        /* Jog Wheels / Decks Estilo CDJ */
        .cdj-deck {
            background: #0a0e14;
            border: 1px solid #21262d;
            border-radius: 12px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.9);
        }

        .jog-wheel {
            width: 110px; height: 110px; border-radius: 50%;
            background: radial-gradient(circle, #161b22 0%, #0d1117 75%, #000000 100%);
            border: 4px solid #30363d;
            position: relative; margin: 0 auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            z-index: 1;
        }
        
        /* ANILLO LED RGB DINÁMICO (EFECTO PROFESIONAL) */
        .jog-wheel::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(#00ffcc, #ff007f, #ffcc00, #00ffcc);
            z-index: -1;
            opacity: 0;
            filter: blur(5px);
            transition: opacity 0.4s ease;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .jog-wheel.playing-glow::after {
            opacity: 1;
            animation: spinRing 3s linear infinite;
        }

        .video-container { width: 70px; height: 70px; border-radius: 50%; overflow: hidden; pointer-events: none; }

        /* Botones de Hardware Pro */
        .btn-hardware {
            background: #161b22; border: 1px solid #484f58; color: #c9d1d9;
            font-weight: bold; font-size: 0.7rem; text-transform: uppercase;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); transition: 0.1s;
        }
        .btn-hardware:active { transform: translateY(2px); }
        .btn-play-pro { background: linear-gradient(180deg, #238636 0%, #196127 100%); border-color: #2ea043; color: #fff; }
        .btn-cue-pro { background: linear-gradient(180deg, #bb8009 0%, #9e6a03 100%); border-color: #d29922; color: #fff; }

        /* Estilo canciones tocadas */
        .song-item.played {
            background-color: #3b1111 !important;
            border-left: 4px solid #f85149 !important;
        }
        .song-item.played .song-title { color: #ff7b72; text-decoration: line-through; }
        .song-item.played .song-meta { color: #ffa198; }

        .playlist-scroll { max-height: 60vh; overflow-y: auto; }
        
        .category-bar {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; white-space: nowrap;
        }
        .category-bar::-webkit-scrollbar { height: 4px; }
        .category-bar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="text-light">

    <nav class="navbar navbar-dark bg-black border-bottom border-secondary px-3 py-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 text-info fw-bold font-monospace">
                <i class="bi bi-soundwave text-warning"></i> RADIO ALEGRÍA <span class="badge bg-warning text-dark fs-6 ms-2">MASTER MIX CONSOLE</span>
            </span>
            <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-2">
                <i class="bi bi-cloud-fill"></i> Firebase Cloud Conectado
            </span>
        </div>
    </nav>

    <div class="cabina-sticky py-3 mb-4">
        <div class="container">
            <div class="dj-mixing-console p-3">
                <div class="row align-items-center justify-content-between g-3 text-center">
                    
                    <div class="col-lg-4 col-md-4">
                        <div class="cdj-deck p-3 shadow">
                            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                                <span class="badge bg-danger fw-bold" style="font-size: 0.75rem;">DECK A</span>
                                <span class="font-monospace text-muted" style="font-size: 10px;" id="cueDisplayA">CUE: 0:00</span>
                            </div>
                            <div class="jog-wheel mb-3" id="deckA">
                                <div class="video-container"><div id="playerA"></div></div>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-hardware btn-cue-pro py-2" onclick="jumpCue('A')"><i class="bi bi-skip-backward-fill"></i> CUE</button>
                                <button class="btn btn-hardware btn-play-pro py-2" onclick="togglePlay('A')"><i class="bi bi-play-fill"></i> PLAY / PAUSE</button>
                                <button class="btn btn-hardware py-1 text-light" style="font-size: 10px;" onclick="setCue('A')"><i class="bi bi-flag-fill"></i> SET CUE</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-4">
                        <div class="bg-black border border-secondary rounded p-3 shadow-inset text-center">
                            
                            <div class="text-warning fw-bold mb-2 small" style="font-size: 0.8rem;"><i class="bi bi-headphones"></i> MASTER PREVIEW</div>
                            
                            <div class="d-flex align-items-center justify-content-center gap-3 bg-secondary bg-opacity-10 p-2 rounded border border-secondary mb-3">
                                <div class="jog-wheel" style="width: 55px; height: 55px; border-width: 2px;" id="deckPreview">
                                    <div class="video-container" style="width: 35px; height: 35px;"><div id="playerPreview"></div></div>
                                </div>
                                <button class="btn btn-warning btn-sm text-dark fw-bold py-1 px-3" onclick="togglePlay('Preview')">
                                    <i class="bi bi-play-fill"></i> Test
                                </button>
                            </div>

                            <hr class="border-secondary my-3">

                            <div>
                                <label class="text-muted small fw-bold mb-1" style="font-size: 9px;">CROSSFADER (DECK A &lt;===================&gt; DECK B)</label>
                                <input type="range" class="form-range" id="crossfader" min="0" max="100" value="50" oninput="updateVolumes()">
                                <div class="d-flex justify-content-between text-muted mt-1" style="font-size: 10px;">
                                    <span>DECK A</span>
                                    <span>DECK B</span>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="col-lg-4 col-md-4">
                        <div class="cdj-deck p-3 shadow">
                            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                                <span class="badge bg-primary fw-bold" style="font-size: 0.75rem;">DECK B</span>
                                <span class="font-monospace text-muted" style="font-size: 10px;" id="cueDisplayB">CUE: 0:00</span>
                            </div>
                            <div class="jog-wheel mb-3" id="deckB">
                                <div class="video-container"><div id="playerB"></div></div>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-hardware btn-cue-pro py-2" onclick="jumpCue('B')"><i class="bi bi-skip-backward-fill"></i> CUE</button>
                                <button class="btn btn-hardware btn-play-pro py-2" onclick="togglePlay('B')"><i class="bi bi-play-fill"></i> PLAY / PAUSE</button>
                                <button class="btn btn-hardware py-1 text-light" style="font-size: 10px;" onclick="setCue('B')"><i class="bi bi-flag-fill"></i> SET CUE</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            
            <div class="col-lg-7">
                <div class="card bg-dark border-secondary shadow">
                    <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-info font-monospace"><i class="bi bi-music-note-list"></i> PLAYLIST CLOUD</h5>
                        <button class="btn btn-danger btn-sm fw-bold" onclick="eliminarSeleccionados()">
                            <i class="bi bi-trash3-fill"></i> Borrar Selección
                        </button>
                    </div>
                    
                    <div class="card-body p-3">
                        <div class="category-bar mb-3" id="categoryButtonsContainer"></div>
                        <div class="playlist-scroll border border-secondary rounded bg-black p-2">
                            <ul class="list-group list-group-flush bg-transparent" id="activeSongList">
                                <div class="text-center text-muted py-4">Cargando pistas...</div>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card bg-dark border-warning shadow">
                    <div class="card-header bg-black border-warning text-warning fw-bold font-monospace">
                        <i class="bi bi-search"></i> BUSCADOR & TRACKLOADER
                    </div>
                    <div class="card-body">
                        
                        <label class="form-label text-muted small fw-bold">1. BUSCAR EN YOUTUBE</label>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control bg-black text-light border-secondary" id="inputBuscar" placeholder="Ej: Marc Anthony Vivir Mi Vida..." onkeypress="handleEnterSearch(event)">
                            <button class="btn btn-danger" type="button" onclick="buscarEnYouTube()"><i class="bi bi-youtube"></i> Abrir YT</button>
                        </div>

                        <hr class="border-secondary my-3">

                        <label class="form-label text-muted small fw-bold">2. AÑADIR A LA NUBE</label>
                        <div class="mb-2">
                            <input type="text" class="form-control bg-black text-light border-secondary mb-2" id="inputUrl" placeholder="Pega el enlace de YouTube...">
                            <input type="text" class="form-control bg-black text-light border-secondary mb-2" id="inputNombre" placeholder="Nombre (o vacío para usar la búsqueda)">
                            <select class="form-select bg-black text-light border-secondary mb-3" id="selectCategoriaPedido">
                                </select>
                            <button class="btn btn-warning text-dark fw-bold w-100 shadow-sm" onclick="agregarPedido()">
                                <i class="bi bi-cloud-arrow-up-fill"></i> Guardar en Firebase
                            </button>
                        </div>

                        <div id="tracklist-pedidos" class="mt-3"></div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDgJM6TtDDpGYRrQRKmxKH3S6XBy8TettY",
            authDomain: "mezcla-bad5e.firebaseapp.com",
            databaseURL: "https://mezcla-bad5e-default-rtdb.firebaseio.com",
            projectId: "mezcla-bad5e",
            storageBucket: "mezcla-bad5e.firebasestorage.app",
            messagingSenderId: "852290612625",
            appId: "1:852290612625:web:439cabe2c3494cdbe93e30"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerA, playerB, playerPreview;
        let tracks = [];
        let cuePointA = 0, cuePointB = 0;
        let activeCategory = null;

        const tracksIniciales = [
            { id: 'Gs069dndIYk', artist: 'Earth, Wind & Fire - September', bpm: 125, decade: '70s Disco' },
            { id: 'I_izvAbhExY', artist: 'Bee Gees - Stayin\' Alive', bpm: 104, decade: '70s Disco' },
            { id: 'djV11Xbc914', artist: 'A-ha - Take On Me', bpm: 169, decade: '80s Pop' },
            { id: 'Zi_XLOBDo_Y', artist: 'Michael Jackson - Billie Jean', bpm: 117, decade: '80s Pop' },
            { id: 'HEXWRTEbj1I', artist: 'Haddaway - What Is Love', bpm: 124, decade: '90s Eurodance' },
            { id: 'PWgvGjAhvIw', artist: 'Outkast - Hey Ya!', bpm: 160, decade: '2000s Club' },
            { id: 'ZbZSe6N_BXs', artist: 'Pharrell Williams - Happy', bpm: 160, decade: 'Actualidad' },
            { id: 'qGKrc3A6HHM', artist: 'Daddy Yankee - Gasolina', bpm: 96, decade: 'Reggaeton' },
            { id: 'YXnjy5YlDwk', artist: 'Marc Anthony - Vivir Mi Vida', bpm: 105, decade: 'Tropical y Salsa' },
            { id: 'h9tXY5j3NY8', artist: 'Chayanne - Dejaría Todo', bpm: 80, decade: 'Baladas y Románticos' }
        ];

        db.ref('tracks').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                tracks = Object.values(data);
            } else {
                tracks = tracksIniciales;
                db.ref('tracks').set(tracksIniciales);
            }
            renderizarBaseDatos();
        });

        function renderizarBaseDatos() {
            const catContainer = document.getElementById('categoryButtonsContainer');
            const songListContainer = document.getElementById('activeSongList');
            const selectDiv = document.getElementById('selectCategoriaPedido');
            
            const estilos = [...new Set(tracks.map(t => t.decade))];
            
            if (!activeCategory || !estilos.includes(activeCategory)) {
                activeCategory = estilos[0] || '';
            }

            let htmlButtons = '';
            let htmlSelect = '';

            estilos.forEach((estilo) => {
                htmlSelect += `<option value="${estilo}">${estilo}</option>`;
                
                let isActive = estilo === activeCategory 
                    ? 'btn-warning text-dark shadow' 
                    : 'btn-dark text-light border-secondary';
                
                let count = tracks.filter(t => t.decade === estilo).length;

                htmlButtons += `
                    <button class="btn btn-sm fw-bold px-3 py-2 ${isActive} d-flex align-items-center gap-2 flex-shrink-0" onclick="setActiveCategory('${estilo}')">
                        <i class="bi bi-vinyl"></i> ${estilo} <span class="badge bg-black text-light opacity-75">${count}</span>
                    </button>
                `;
            });

            catContainer.innerHTML = htmlButtons;
            selectDiv.innerHTML = htmlSelect + `<option value="Pedidos Temporales">⭐ Lista Temporal de Pedidos</option>`;

            let htmlSongs = '';
            tracks.forEach((track, globalIndex) => {
                if (track.decade === activeCategory) {
                    htmlSongs += generarHtmlCancion(track, globalIndex);
                }
            });

            if (htmlSongs === '') {
                htmlSongs = `<li class="list-group-item bg-transparent text-center text-muted py-4 border-0">No hay pistas en esta categoría.</li>`;
            }

            songListContainer.innerHTML = htmlSongs;
        }

        function setActiveCategory(estilo) {
            activeCategory = estilo;
            renderizarBaseDatos();
        }

        function generarHtmlCancion(track, globalIndex) {
            return `
                <li class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between align-items-center py-2 px-3 song-item mb-1 rounded" data-id="${track.id}">
                    <div class="d-flex align-items-center gap-2 overflow-hidden me-2">
                        <input class="form-check-input track-checkbox mt-0" type="checkbox" value="${globalIndex}" style="cursor: pointer;">
                        <div class="song-info text-truncate">
                            <div class="song-title fw-semibold text-truncate" style="font-size: 0.9rem;">${track.artist}</div>
                            <span class="song-meta badge bg-secondary bg-opacity-25 text-info border border-secondary font-monospace" style="font-size: 9px;">⚡ ${track.bpm || '?'} BPM</span>
                        </div>
                    </div>
                    <div class="btn-group btn-group-sm flex-shrink-0">
                        <button class="btn btn-outline-warning text-warning px-2" onclick="previewSong('${track.id}')" title="Test Pre-escucha"><i class="bi bi-headphones"></i></button>
                        <button class="btn btn-outline-danger px-2 fw-bold" onclick="loadVideo('A', '${track.id}')" title="Cargar Deck A">A</button>
                        <button class="btn btn-outline-primary px-2 fw-bold" onclick="loadVideo('B', '${track.id}')" title="Cargar Deck B">B</button>
                        <button class="btn btn-dark text-danger border-secondary px-2" onclick="eliminarCancion(${globalIndex})" title="Borrar"><i class="bi bi-trash"></i></button>
                    </div>
                </li>
            `;
        }

        function eliminarCancion(index) {
            if (confirm("¿Eliminar esta pista de Firebase?")) {
                tracks.splice(index, 1);
                db.ref('tracks').set(tracks);
            }
        }

        function eliminarSeleccionados() {
            const checkboxes = document.querySelectorAll('.track-checkbox:checked');
            if (checkboxes.length === 0) return alert("Selecciona al menos una pista.");

            if (confirm(`¿Eliminar las ${checkboxes.length} pistas seleccionadas?`)) {
                const indicesAEliminar = Array.from(checkboxes).map(cb => parseInt(cb.value));
                tracks = tracks.filter((_, index) => !indicesAEliminar.includes(index));
                db.ref('tracks').set(tracks);
            }
        }

        function buscarEnYouTube() {
            const query = document.getElementById('inputBuscar').value.trim();
            if (query) window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            else alert("Escribe el nombre de un artista o tema.");
        }

        function handleEnterSearch(event) { if (event.key === 'Enter') buscarEnYouTube(); }

        function extraerIDYouTube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function agregarPedido() {
            const url = document.getElementById('inputUrl').value.trim();
            let nombre = document.getElementById('inputNombre').value.trim();
            const busqueda = document.getElementById('inputBuscar').value.trim();
            const catSeleccionada = document.getElementById('selectCategoriaPedido').value;
            
            if (!url) return alert("Pega un enlace de YouTube.");
            const videoId = extraerIDYouTube(url);
            if (!videoId) return alert("Enlace de YouTube no válido.");

            if (!nombre) {
                nombre = busqueda ? busqueda : "Audio Nuevo";
            }

            if (catSeleccionada === 'Pedidos Temporales') {
                const contenedor = document.getElementById('tracklist-pedidos');
                contenedor.innerHTML = `
                    <div class="alert alert-warning py-2 mb-2 d-flex justify-content-between align-items-center">
                        <span class="small fw-bold text-truncate me-2">${nombre}</span>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-warning text-dark" onclick="previewSong('${videoId}')"><i class="bi bi-headphones"></i></button>
                            <button class="btn btn-danger" onclick="loadVideo('A', '${videoId}')">A</button>
                            <button class="btn btn-primary" onclick="loadVideo('B', '${videoId}')">B</button>
                        </div>
                    </div>
                ` + contenedor.innerHTML;
            } else {
                tracks.push({ id: videoId, artist: nombre, bpm: '?', decade: catSeleccionada });
                db.ref('tracks').set(tracks);
            }

            document.getElementById('inputUrl').value = '';
            document.getElementById('inputNombre').value = '';
        }

        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '200', width: '200',
                videoId: tracks.length > 0 ? tracks[0].id : 'Gs069dndIYk',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'A') }
            });
            playerB = new YT.Player('playerB', {
                height: '200', width: '200',
                videoId: tracks.length > 1 ? tracks[1].id : 'I_izvAbhExY',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'B') }
            });
            playerPreview = new YT.Player('playerPreview', {
                height: '100', width: '100',
                videoId: tracks.length > 2 ? tracks[2].id : 'xFrGuyw1V8s',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'Preview') }
            });
        }

        function onPlayerReady() { updateVolumes(); }

        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'Preview' ? 'deckPreview' : 'deck' + deck);
            if (deckElement) {
                if (event.data === YT.PlayerState.PLAYING) {
                    deckElement.classList.add('playing-glow');
                } else {
                    deckElement.classList.remove('playing-glow');
                }
            }
        }

        function previewSong(videoId) {
            if (playerPreview) {
                playerPreview.loadVideoById(videoId);
                playerPreview.playVideo();
            }
        }

        function loadVideo(deck, videoId) {
            if (deck === 'A') {
                playerA.cueVideoById(videoId);
                cuePointA = 0;
                document.getElementById('cueDisplayA').innerText = `CUE: 0:00`;
            } else {
                playerB.cueVideoById(videoId);
                cuePointB = 0;
                document.getElementById('cueDisplayB').innerText = `CUE: 0:00`;
            }

            document.querySelectorAll(`.song-item[data-id="${videoId}"]`).forEach(el => el.classList.add('played'));
        }

        function togglePlay(deck) {
            let p = deck === 'A' ? playerA : (deck === 'B' ? playerB : playerPreview);
            if (p && p.getPlayerState && p.getPlayerState() === 1) p.pauseVideo();
            else if (p && p.playVideo) p.playVideo();
        }

        function setCue(deck) {
            let player = deck === 'A' ? playerA : playerB;
            if (player && player.getCurrentTime) {
                let time = player.getCurrentTime();
                if (deck === 'A') {
                    cuePointA = time;
                    document.getElementById('cueDisplayA').innerText = `CUE: ${formatTime(time)}`;
                } else {
                    cuePointB = time;
                    document.getElementById('cueDisplayB').innerText = `CUE: ${formatTime(time)}`;
                }
            }
        }

        function jumpCue(deck) {
            let player = deck === 'A' ? playerA : playerB;
            let time = deck === 'A' ? cuePointA : cuePointB;
            if (player && player.seekTo) {
                player.seekTo(time, true);
                player.pauseVideo();
            }
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateVolumes() {
            if (!playerA || !playerB || !playerA.setVolume || !playerB.setVolume) return;
            let cf = document.getElementById('crossfader').value;

            let volA = cf <= 50 ? 100 : 100 - ((cf - 50) * 2);
            let volB = cf >= 50 ? 100 : cf * 2;

            playerA.setVolume(volA);
            playerB.setVolume(volB);

            if (playerPreview && playerPreview.setVolume) playerPreview.setVolume(80);
        }
    </script>
</body>
</html>
