<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Alegria - Mezcladora Web Profesional</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
        p.subtitle { color: #aaa; margin-bottom: 30px; font-size: 1.1em; }
        
        .dj-booth {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .deck-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
        }

        h2 { margin-top: 0; color: #fff; }
        .title-pedidos { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }

        /* Diseño del Vinilo */
        .deck {
            background: #000;
            border: 12px solid #333;
            border-radius: 50%;
            width: 280px;
            height: 280px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: transform 0.1s linear;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }

        .video-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .controls { margin-top: 20px; }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover { background: #00cca3; transform: scale(1.05); }

        .mixer-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2a2a2a;
            padding: 30px 20px;
            border-radius: 15px;
            border: 2px solid #444;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        input[type=range] { width: 250px; margin: 20px 0; cursor: pointer; accent-color: #00ffcc; }

        /* Layout de las listas */
        .playlists-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .playlist {
            flex: 1;
            min-width: 350px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            border: 1px solid #333;
        }

        .playlist.pedidos-box { border-color: #554400; background: #1a170d; }
        
        .tracklist-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .tracklist-container::-webkit-scrollbar { width: 8px; }
        .tracklist-container::-webkit-scrollbar-track { background: #111; border-radius: 4px; }
        .tracklist-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }
        .pedidos-box .tracklist-container::-webkit-scrollbar-thumb { background: #ffcc00; }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #333;
            transition: 0.2s;
        }
        .song-item:hover { background: #2a2a2a; }
        
        .song-info { display: flex; flex-direction: column; }
        .song-title { font-size: 15px; font-weight: bold; }
        .song-meta { font-size: 12px; color: #00ffcc; margin-top: 4px; }
        .pedidos-box .song-meta { color: #ffcc00; }
        
        .load-buttons button { margin-left: 8px; font-size: 12px; padding: 6px 12px; background: #444; color: white; }
        .load-buttons button:hover { background: #666; }
        .load-buttons .btn-a:hover { background: #ff0055; }
        .load-buttons .btn-b:hover { background: #0088ff; }

        /* Estilos del buscador y agregar pedidos */
        .input-pedido-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-pedido-container input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
        }
        .btn-pedido {
            background: #ffcc00;
            color: #000;
            padding: 10px 15px;
        }
        .btn-pedido:hover { background: #e6b800; }
        
        /* Divisor entre buscar y agregar */
        .divisor {
            height: 1px;
            background: #554400;
            margin: 15px 0;
        }
        .etiqueta-pequena {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            display: block;
        }

    </style>
</head>
<body>

    <h1>📻 Radio Web: Cabina Interactiva</h1>
    <p class="subtitle">Mezcladora + Setlist + Pedidos en Vivo</p>

    <div class="dj-booth">
        <!-- DECK A -->
        <div class="deck-container">
            <h2 style="color: #ff0055;">DECK A</h2>
            <div class="deck" id="deckA">
                <div class="video-container">
                    <div id="playerA"></div>
                </div>
            </div>
            <div class="controls">
                <button onclick="togglePlay('A')" style="background: #ff0055; color: white;">▶️ Play / ⏸️ Pause A</button>
            </div>
        </div>

        <!-- CROSSFADER -->
        <div class="mixer-controls">
            <h3>Crossfader</h3>
            <span style="font-size: 12px; color: #888;">A &lt;========&gt; B</span>
            <input type="range" id="crossfader" min="0" max="100" value="50" oninput="updateVolumes()">
        </div>

        <!-- DECK B -->
        <div class="deck-container">
            <h2 style="color: #0088ff;">DECK B</h2>
            <div class="deck" id="deckB">
                <div class="video-container">
                    <div id="playerB"></div>
                </div>
            </div>
            <div class="controls">
                <button onclick="togglePlay('B')" style="background: #0088ff; color: white;">▶️ Play / ⏸️ Pause B</button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DE LAS DOS LISTAS -->
    <div class="playlists-container">
        
        <!-- LISTA PRINCIPAL -->
        <div class="playlist">
            <h2>🎵 Setlist Principal</h2>
            <div class="tracklist-container" id="tracklist">
                <!-- Se inyecta con JS -->
            </div>
        </div>

        <!-- LISTA DE PEDIDOS -->
        <div class="playlist pedidos-box">
            <h2 class="title-pedidos">🎤 Pedidos del Público</h2>
            
            <!-- PASO 1: Buscar en YouTube -->
            <span class="etiqueta-pequena">Paso 1: Busca la canción en YouTube</span>
            <div class="input-pedido-container">
                <input type="text" id="inputBuscar" placeholder="Ej: Dua Lipa Audio..." onkeypress="handleEnterSearch(event)">
                <button class="btn-pedido" onclick="buscarEnYouTube()" style="background: #ff0000; color: white;">🔍 Buscar en YT</button>
            </div>

            <div class="divisor"></div>

            <!-- PASO 2: Pegar y Añadir -->
            <span class="etiqueta-pequena">Paso 2: Pega el enlace aquí para añadirlo al Set</span>
            <div class="input-pedido-container">
                <input type="text" id="inputUrl" placeholder="Pega el enlace de YT...">
                <input type="text" id="inputNombre" placeholder="Nombre" style="flex: 0.5;">
                <button class="btn-pedido" onclick="agregarPedido()">➕ Añadir</button>
            </div>

            <div class="tracklist-container" id="tracklist-pedidos" style="margin-top: 15px;">
                <!-- Los pedidos nuevos caerán aquí -->
            </div>
        </div>

    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let playerA, playerB;
        let contadorPedidos = 1;

        // Base de datos de prueba (Aquí van tus 100 canciones)
        const tracks = [
            { id: '3cQNkIrg-Tk', artist: 'Earth, Wind & Fire - September', bpm: 125, decade: '70s' },
            { id: '_Vj092UgKwQ', artist: 'Bee Gees - Stayin\' Alive', bpm: 104, decade: '70s' },
            { id: 'djV11Xbc914', artist: 'A-ha - Take On Me', bpm: 169, decade: '80s' },
            { id: 'HEXWRTEbj1I', artist: 'Haddaway - What Is Love', bpm: 124, decade: '90s' },
            { id: 'gGdGFtwPNsQ', artist: 'The Killers - Mr. Brightside', bpm: 148, decade: '00s' },
            { id: 'ZbZSe6N_BXs', artist: 'Pharrell Williams - Happy', bpm: 160, decade: 'Actual' }
        ];

        // 1. LLENAMOS LA LISTA PRINCIPAL
        tracks.sort((a, b) => a.bpm - b.bpm);
        const tracklistDiv = document.getElementById('tracklist');
        tracks.forEach(track => {
            tracklistDiv.innerHTML += `
                <div class="song-item">
                    <div class="song-info">
                        <span class="song-title">${track.artist}</span>
                        <span class="song-meta">Estilo: ${track.decade} | ⚡ ${track.bpm} BPM</span>
                    </div>
                    <div class="load-buttons">
                        <button class="btn-a" onclick="loadVideo('A', '${track.id}')">Deck A</button>
                        <button class="btn-b" onclick="loadVideo('B', '${track.id}')">Deck B</button>
                    </div>
                </div>
            `;
        });

        // 2. FUNCIÓN PARA BUSCAR EN YOUTUBE DIRECTAMENTE
        function buscarEnYouTube() {
            const query = document.getElementById('inputBuscar').value.trim();
            if (query) {
                // Abre YouTube en una nueva pestaña con los resultados de búsqueda
                const ytSearchUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query);
                window.open(ytSearchUrl, '_blank');
            } else {
                alert("Escribe el nombre de una canción para buscar.");
            }
        }

        function handleEnterSearch(event) {
            if (event.key === 'Enter') {
                buscarEnYouTube();
            }
        }

        // 3. LÓGICA PARA AÑADIR PEDIDOS (Mantenida igual)
        function extraerIDYouTube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function agregarPedido() {
            const url = document.getElementById('inputUrl').value.trim();
            let nombre = document.getElementById('inputNombre').value.trim();
            
            if (!url) return alert("Pega un enlace de YouTube.");

            const videoId = extraerIDYouTube(url);
            if (!videoId) return alert("Enlace inválido.");
            if (!nombre) nombre = "Pedido " + contadorPedidos;

            const listaPedidos = document.getElementById('tracklist-pedidos');
            listaPedidos.innerHTML = `
                <div class="song-item" style="background-color: #332b00;">
                    <div class="song-info">
                        <span class="song-title">${nombre}</span>
                        <span class="song-meta">ID: ${videoId}</span>
                    </div>
                    <div class="load-buttons">
                        <button class="btn-a" onclick="loadVideo('A', '${videoId}')">Deck A</button>
                        <button class="btn-b" onclick="loadVideo('B', '${videoId}')">Deck B</button>
                    </div>
                </div>
            ` + listaPedidos.innerHTML;

            document.getElementById('inputUrl').value = '';
            document.getElementById('inputNombre').value = '';
            contadorPedidos++;
        }

        // 4. API DE YOUTUBE Y REPRODUCTORES
        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '300', width: '300',
                videoId: tracks[0].id, 
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'A') }
            });
            playerB = new YT.Player('playerB', {
                height: '300', width: '300',
                videoId: tracks[1].id,
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'B') }
            });
        }

        function onPlayerReady() { updateVolumes(); }

        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'A' ? 'deckA' : 'deckB');
            if (event.data === YT.PlayerState.PLAYING) deckElement.classList.add('spinning');
            else deckElement.classList.remove('spinning');
        }

        function loadVideo(deck, videoId) {
            if (deck === 'A') playerA.cueVideoById(videoId);
            else playerB.cueVideoById(videoId);
        }

        function togglePlay(deck) {
            let p = deck === 'A' ? playerA : playerB;
            if (p.getPlayerState() === 1) p.pauseVideo();
            else p.playVideo();
        }

        function updateVolumes() {
            if (!playerA || !playerB) return;
            let f = document.getElementById('crossfader').value;
            playerA.setVolume(f <= 50 ? 100 : 100 - ((f - 50) * 2));
            playerB.setVolume(f >= 50 ? 100 : f * 2);
        }
    </script>
</body>
</html>
