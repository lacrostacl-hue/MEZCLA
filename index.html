<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Radio Latido Musical - Master Console Pro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body { 
            background: #030406;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            color: #e6edf3;
        }
        
        /* Cabina Superior Compacta y Elegante */
        .cabina-sticky {
            position: sticky; top: 0; z-index: 1030;
            background: rgba(3, 4, 6, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid #21262d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .dj-mixing-console {
            background: linear-gradient(145deg, #0d1117 0%, #05070a 100%);
            border: 1px solid #30363d;
            border-radius: 16px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.05);
        }

        /* Jog Wheels / Decks Estilo CDJ Pro */
        .cdj-deck {
            background: #090d13;
            border: 1px solid #21262d;
            border-radius: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        }

        .jog-wheel {
            width: 75px; height: 75px; border-radius: 50%;
            background: radial-gradient(circle, #161b22 0%, #0d1117 75%, #000000 100%);
            border: 3px solid #30363d;
            position: relative; margin: 0 auto;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        
        .jog-wheel.playing-active {
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0,255,204,0.4);
        }

        .video-container { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; pointer-events: none; }

        /* Botones de Hardware Pro */
        .btn-hardware {
            background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
            font-weight: bold; font-size: 0.65rem; text-transform: uppercase;
        }
        .btn-hardware:active { transform: translateY(1px); }
        .btn-play-pro { background: #238636; border-color: #2ea043; color: #fff; }
        .btn-cue-pro { background: #bb8009; border-color: #d29922; color: #fff; }
        .btn-eject-pro { background: #da3633; border-color: #f85149; color: #fff; }

        /* Botón Solo Preview */
        .btn-solo-preview {
            background: #161b22; border: 1px solid #30363d; color: #c9d1d9; font-weight: bold; font-size: 0.7rem;
        }
        .btn-solo-preview.active-solo {
            background: #1f6feb !important; border-color: #58a6ff !important; color: #fff !important;
            box-shadow: 0 0 8px rgba(31, 111, 235, 0.6);
        }

        /* Performance Pads (Hot Cues) */
        .hot-cue-pad {
            background: #11161d; border: 1px solid #30363d; color: #8b949e;
            font-size: 0.6rem; font-weight: bold; border-radius: 4px; padding: 2px 0;
        }
        .hot-cue-pad.active {
            background: #1f6feb; border-color: #58a6ff; color: #fff;
            box-shadow: 0 0 6px rgba(31, 111, 235, 0.5);
        }

        /* Waveform Canvas Ligero */
        .waveform-canvas {
            width: 100%; height: 24px; background: #010203; border-radius: 4px; border: 1px solid #21262d;
        }

        /* Fader Vertical Estilo Mesa Real */
        .fader-vertical-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px;
        }
        .fader-vertical {
            -webkit-appearance: slider-vertical;
            width: 8px; height: 75px;
            background: #161b22; cursor: pointer;
        }

        /* Estilo canciones tocadas */
        .song-item {
            transition: background 0.15s ease;
        }
        .song-item:hover {
            background-color: #161b22 !important;
        }
        .song-item.played {
            background-color: rgba(59, 17, 17, 0.5) !important;
            border-left: 4px solid #f85149 !important;
        }
        .song-item.played .song-title { color: #ff7b72; text-decoration: line-through; }
        .song-item.played .song-meta { color: #ffa198; }

        .playlist-scroll { max-height: 55vh; overflow-y: auto; }
        
        .category-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; white-space: nowrap; }
        .category-bar::-webkit-scrollbar { height: 4px; }
        .category-bar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

        .card {
            background: #0b0f15 !important;
            border: 1px solid #21262d !important;
            border-radius: 14px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body onclick="window.focus();" onkeydown="window.focus();">

    <!-- CABINA DE MEZCLAS FIJA SUPERIOR -->
    <div class="cabina-sticky py-2">
        <div class="container-fluid px-3">
            <div class="dj-mixing-console p-2">
                <div class="row align-items-center justify-content-between g-2 text-center">
                    
                    <!-- DECK A -->
                    <div class="col-lg-4 col-md-4">
                        <div class="cdj-deck p-2 shadow">
                            <div class="d-flex justify-content-between align-items-center mb-1 px-1">
                                <span class="badge bg-danger fw-bold" style="font-size: 0.7rem;">DECK A <small class="text-muted font-monospace">[Q/A]</small></span>
                                <span class="font-monospace text-muted" style="font-size: 9px;" id="cueDisplayA">CUE: 0:00</span>
                            </div>
                            <div class="text-truncate fw-bold text-warning font-monospace mb-1 px-1" id="trackTitleA" style="font-size: 10px;" title="Sin pista cargada">[ DECK A VACÍO ]</div>
                            <div class="text-info font-monospace mb-1 fw-bold" style="font-size: 10px;" id="timeDisplayA">0:00 / -0:00</div>
                            
                            <div class="jog-wheel mb-1" id="deckA">
                                <div class="video-container"><div id="playerA"></div></div>
                            </div>
                            <div class="mb-1">
                                <canvas id="waveformA" class="waveform-canvas"></canvas>
                            </div>
                            <div class="d-flex gap-1 mb-1">
                                <button class="btn btn-hardware btn-eject-pro px-2 py-1" onclick="ejectDeck('A')" title="Expulsar Tema"><i class="bi bi-eject-fill"></i></button>
                                <button class="btn btn-hardware btn-cue-pro flex-fill py-1" onclick="jumpCue('A')">CUE <small class="opacity-75">[A]</small></button>
                                <button class="btn btn-hardware btn-play-pro flex-fill py-1" onclick="togglePlay('A')">PLAY <small class="opacity-75">[Q]</small></button>
                            </div>
                            <!-- Hot Cues (1-4) -->
                            <div class="row g-1 text-center">
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padA1" onclick="handleHotCue('A', 1)">1 <small>[1]</small></button></div>
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padA2" onclick="handleHotCue('A', 2)">2 <small>[2]</small></button></div>
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padA3" onclick="handleHotCue('A', 3)">3 <small>[3]</small></button></div>
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padA4" onclick="handleHotCue('A', 4)">4 <small>[4]</small></button></div>
                            </div>
                        </div>
                    </div>

                    <!-- MESA CENTRAL (MIXER) -->
                    <div class="col-lg-4 col-md-4">
                        <div class="bg-black border border-secondary rounded p-2 shadow-inset text-center bg-opacity-75">
                            
                            <div class="d-flex align-items-center justify-content-between bg-secondary bg-opacity-10 px-2 py-1 rounded border border-secondary mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="jog-wheel" style="width: 30px; height: 30px; border-width: 2px;" id="deckPreview">
                                        <div class="video-container" style="width: 18px; height: 18px;"><div id="playerPreview"></div></div>
                                    </div>
                                    <span class="small text-warning fw-bold font-monospace" style="font-size: 0.7rem;">PREVIEW <small class="text-muted">[Space]</small></span>
                                </div>
                                <button class="btn btn-warning btn-sm text-dark fw-bold py-0 px-2" style="font-size: 0.75rem;" onclick="togglePlay('Preview')">
                                    Test
                                </button>
                            </div>

                            <div class="mb-2">
                                <button class="btn btn-solo-preview w-100 py-1" id="soloPreviewBtn" onclick="toggleSoloPreview()" style="font-size: 0.7rem;">
                                    <i class="bi bi-headphones"></i> SOLO CUE (PREVIEW)
                                </button>
                            </div>

                            <!-- FADERS DE VOLUMEN VERTICALES Y CROSSFADER -->
                            <div class="row align-items-center justify-content-center bg-secondary bg-opacity-10 p-1 rounded border border-secondary mb-2">
                                <div class="col-6 text-center border-end border-secondary">
                                    <label class="text-muted fw-bold font-monospace d-block" style="font-size: 7px;">VOL A <span class="text-info">[W/S]</span></label>
                                    <div class="fader-vertical-container">
                                        <input type="range" class="fader-vertical" id="volumeDeckA" min="0" max="100" value="100" oninput="updateVolumes()">
                                    </div>
                                    <span id="volValA" class="text-light font-monospace fw-bold" style="font-size: 9px;">100%</span>
                                </div>
                                <div class="col-6 text-center">
                                    <label class="text-muted fw-bold font-monospace d-block" style="font-size: 7px;">VOL B <span class="text-info">[I/K]</span></label>
                                    <div class="fader-vertical-container">
                                        <input type="range" class="fader-vertical" id="volumeDeckB" min="0" max="100" value="100" oninput="updateVolumes()">
                                    </div>
                                    <span id="volValB" class="text-light font-monospace fw-bold" style="font-size: 9px;">100%</span>
                                </div>
                            </div>

                            <div class="pt-1 border-top border-secondary">
                                <label class="text-muted fw-bold mb-1 font-monospace" style="font-size: 8px;">CROSSFADER <small class="text-info">[← / →]</small></label>
                                <input type="range" class="form-range form-range-sm" id="crossfader" min="0" max="100" value="50" oninput="updateVolumes()">
                            </div>

                        </div>
                    </div>

                    <!-- DECK B -->
                    <div class="col-lg-4 col-md-4">
                        <div class="cdj-deck p-2 shadow">
                            <div class="d-flex justify-content-between align-items-center mb-1 px-1">
                                <span class="badge bg-primary fw-bold" style="font-size: 0.7rem;">DECK B <small class="text-muted font-monospace">[P/O]</small></span>
                                <span class="font-monospace text-muted" style="font-size: 9px;" id="cueDisplayB">CUE: 0:00</span>
                            </div>
                            <div class="text-truncate fw-bold text-warning font-monospace mb-1 px-1" id="trackTitleB" style="font-size: 10px;" title="Sin pista cargada">[ DECK B VACÍO ]</div>
                            <div class="text-primary font-monospace mb-1 fw-bold" style="font-size: 10px;" id="timeDisplayB">0:00 / -0:00</div>

                            <div class="jog-wheel mb-1" id="deckB">
                                <div class="video-container"><div id="playerB"></div></div>
                            </div>
                            <div class="mb-1">
                                <canvas id="waveformB" class="waveform-canvas"></canvas>
                            </div>
                            <div class="d-flex gap-1 mb-1">
                                <button class="btn btn-hardware btn-eject-pro px-2 py-1" onclick="ejectDeck('B')" title="Expulsar Tema"><i class="bi bi-eject-fill"></i></button>
                                <button class="btn btn-hardware btn-cue-pro flex-fill py-1" onclick="jumpCue('B')">CUE <small class="opacity-75">[O]</small></button>
                                <button class="btn btn-hardware btn-play-pro flex-fill py-1" onclick="togglePlay('B')">PLAY <small class="opacity-75">[P]</small></button>
                            </div>
                            <!-- Hot Cues (1-4) -->
                            <div class="row g-1 text-center">
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padB1" onclick="handleHotCue('B', 1)">1 <small>[7]</small></button></div>
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padB2" onclick="handleHotCue('B', 2)">2 <small>[8]</small></button></div>
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padB3" onclick="handleHotCue('B', 3)">3 <small>[9]</small></button></div>
                                <div class="col-3"><button class="btn hot-cue-pad w-100" id="padB4" onclick="handleHotCue('B', 4)">4 <small>[0]</small></button></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL / PLAYLIST Y GESTOR -->
    <div class="container-fluid px-3 my-4">
        <div class="row g-3">
            
            <!-- SETLIST PRINCIPAL -->
            <div class="col-lg-7">
                <div class="card shadow">
                    <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center py-2 px-3">
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-info fw-bold font-monospace"><i class="bi bi-music-note-list"></i> PLAYLIST CLOUD</span>
                            <span class="badge bg-warning text-dark font-monospace" style="font-size: 10px;">DJ RADIO LATIDO MUSICAL</span>
                        </div>
                        <button class="btn btn-danger btn-sm fw-bold py-1 px-2" style="font-size: 0.75rem;" onclick="eliminarSeleccionados()">
                            <i class="bi bi-trash3-fill"></i> Borrar Selección
                        </button>
                    </div>
                    
                    <div class="card-body p-3">
                        <div class="category-bar mb-2" id="categoryButtonsContainer"></div>
                        
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-sm bg-black text-light border-secondary" id="quickSearchInput" placeholder="🔍 Buscar por artista o título en toda la base de datos..." oninput="renderizarBaseDatos()">
                        </div>

                        <div class="playlist-scroll border border-secondary rounded bg-black p-2">
                            <ul class="list-group list-group-flush bg-transparent" id="activeSongList">
                                <div class="text-center text-muted py-4">Cargando pistas...</div>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BUSCADOR & GESTOR -->
            <div class="col-lg-5">
                <div class="card shadow border-warning">
                    <div class="card-header bg-black border-warning text-warning fw-bold font-monospace py-2 px-3">
                        <i class="bi bi-search"></i> BUSCADOR & TRACKLOADER
                    </div>
                    <div class="card-body p-3">
                        
                        <label class="form-label text-muted small fw-bold font-monospace">1. BUSCAR EN YOUTUBE</label>
                        <div class="input-group input-group-sm mb-3">
                            <input type="text" class="form-control bg-black text-light border-secondary" id="inputBuscar" placeholder="Ej: Latido Musical Mix..." onkeypress="handleEnterSearch(event)">
                            <button class="btn btn-danger" type="button" onclick="buscarEnYouTube()"><i class="bi bi-youtube"></i> Abrir YT</button>
                        </div>

                        <hr class="border-secondary my-2">

                        <label class="form-label text-muted small fw-bold font-monospace">2. AÑADIR A LA NUBE (AUTODETECTA TÍTULO)</label>
                        <div class="mb-1">
                            <input type="text" class="form-control form-control-sm bg-black text-light border-secondary mb-2" id="inputUrl" placeholder="Pega el enlace de YouTube..." onblur="autoDetectTitle()">
                            <input type="text" class="form-control form-control-sm bg-black text-light border-secondary mb-2" id="inputNombre" placeholder="Nombre de la pista (o déjalo vacío)">
                            <select class="form-select form-select-sm bg-black text-light border-secondary mb-2" id="selectCategoriaPedido">
                                <!-- Dinámico -->
                            </select>
                            <button class="btn btn-warning btn-sm text-dark fw-bold w-100 shadow-sm py-2" onclick="agregarPedido()">
                                <i class="bi bi-cloud-arrow-up-fill"></i> Guardar en Firebase
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDgJM6TtDDpGYRrQRKmxKH3S6XBy8TettY",
            authDomain: "mezcla-bad5e.firebaseapp.com",
            databaseURL: "https://mezcla-bad5e-default-rtdb.firebaseio.com",
            projectId: "mezcla-bad5e",
            storageBucket: "mezcla-bad5e.firebasestorage.app",
            messagingSenderId: "852290612625",
            appId: "1:852290612625:web:439cabe2c3494cdbe93e30"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerA, playerB, playerPreview;
        let tracks = [];
        let cuePointA = 0, cuePointB = 0;
        let activeCategory = null;
        let isSoloPreviewActive = false;

        let hotCuesA = {1: null, 2: null, 3: null, 4: null};
        let hotCuesB = {1: null, 2: null, 3: null, 4: null};

        const tracksIniciales = [
            { id: 'Gs069dndIYk', artist: 'Earth, Wind & Fire - September', bpm: 125, decade: '70s Disco' },
            { id: 'I_izvAbhExY', artist: 'Bee Gees - Stayin\' Alive', bpm: 104, decade: '70s Disco' },
            { id: 'djV11Xbc914', artist: 'A-ha - Take On Me', bpm: 169, decade: '80s Pop' },
            { id: 'Zi_XLOBDo_Y', artist: 'Michael Jackson - Billie Jean', bpm: 117, decade: '80s Pop' },
            { id: 'HEXWRTEbj1I', artist: 'Haddaway - What Is Love', bpm: 124, decade: '90s Eurodance' },
            { id: 'PWgvGjAhvIw', artist: 'Outkast - Hey Ya!', bpm: 160, decade: '2000s Club' },
            { id: 'ZbZSe6N_BXs', artist: 'Pharrell Williams - Happy', bpm: 160, decade: 'Actualidad' },
            { id: 'qGKrc3A6HHM', artist: 'Daddy Yankee - Gasolina', bpm: 96, decade: 'Reggaeton' },
            { id: 'YXnjy5YlDwk', artist: 'Marc Anthony - Vivir Mi Vida', bpm: 105, decade: 'Tropical y Salsa' },
            { id: 'h9tXY5j3NY8', artist: 'Chayanne - Dejaría Todo', bpm: 80, decade: 'Baladas y Románticos' },
            { id: 'custom_pedidos', artist: 'Ejemplo - Pedido del Público', bpm: 100, decade: '⭐ Pedidos y Solicitudes' }
        ];

        db.ref('tracks').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                tracks = Object.values(data);
            } else {
                tracks = tracksIniciales;
                db.ref('tracks').set(tracksIniciales);
            }
            renderizarBaseDatos();
        });

        // =========================================================
        // CONTROL DE TECLADO ROBUSTO Y PERMANENTE (Listener Global)
        // =========================================================
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

            const code = e.code;

            // Deck A: Q (Play), A (Cue), W/S (Vol Up/Down), 1-4 (Hot Cues)
            if (code === 'KeyQ') { togglePlay('A'); e.preventDefault(); }
            if (code === 'KeyA') { jumpCue('A'); e.preventDefault(); }
            if (code === 'KeyW') {
                let v = document.getElementById('volumeDeckA');
                v.value = Math.min(100, parseInt(v.value) + 5);
                updateVolumes();
                e.preventDefault();
            }
            if (code === 'KeyS') {
                let v = document.getElementById('volumeDeckA');
                v.value = Math.max(0, parseInt(v.value) - 5);
                updateVolumes();
                e.preventDefault();
            }
            if (code === 'Digit1') { handleHotCue('A', 1); e.preventDefault(); }
            if (code === 'Digit2') { handleHotCue('A', 2); e.preventDefault(); }
            if (code === 'Digit3') { handleHotCue('A', 3); e.preventDefault(); }
            if (code === 'Digit4') { handleHotCue('A', 4); e.preventDefault(); }

            // Deck B: P (Play), O (Cue), I/K (Vol Up/Down), 7-0 (Hot Cues)
            if (code === 'KeyP') { togglePlay('B'); e.preventDefault(); }
            if (code === 'KeyO') { jumpCue('B'); e.preventDefault(); }
            if (code === 'KeyI') {
                let v = document.getElementById('volumeDeckB');
                v.value = Math.min(100, parseInt(v.value) + 5);
                updateVolumes();
                e.preventDefault();
            }
            if (code === 'KeyK') {
                let v = document.getElementById('volumeDeckB');
                v.value = Math.max(0, parseInt(v.value) - 5);
                updateVolumes();
                e.preventDefault();
            }
            if (code === 'Digit7') { handleHotCue('B', 1); e.preventDefault(); }
            if (code === 'Digit8') { handleHotCue('B', 2); e.preventDefault(); }
            if (code === 'Digit9') { handleHotCue('B', 3); e.preventDefault(); }
            if (code === 'Digit0') { handleHotCue('B', 4); e.preventDefault(); }

            // Preview Test: Barra Espaciadora
            if (code === 'Space') { togglePlay('Preview'); e.preventDefault(); }

            // Crossfader con Flechas de dirección
            let cfInput = document.getElementById('crossfader');
            if (cfInput) {
                let val = parseInt(cfInput.value);
                if (code === 'ArrowLeft') {
                    cfInput.value = Math.max(0, val - 4);
                    updateVolumes();
                    e.preventDefault();
                } else if (code === 'ArrowRight') {
                    cfInput.value = Math.min(100, val + 4);
                    updateVolumes();
                    e.preventDefault();
                }
            }
        }, true);

        function updateDeckTimes() {
            if (playerA && playerA.getCurrentTime && playerA.getDuration) {
                let curA = playerA.getCurrentTime() || 0;
                let durA = playerA.getDuration() || 0;
                let remA = Math.max(0, durA - curA);
                let elA = document.getElementById('timeDisplayA');
                if (elA) elA.innerText = `${formatTime(curA)} / -${formatTime(remA)}`;
            }
            if (playerB && playerB.getCurrentTime && playerB.getDuration) {
                let curB = playerB.getCurrentTime() || 0;
                let durB = playerB.getDuration() || 0;
                let remB = Math.max(0, durB - curB);
                let elB = document.getElementById('timeDisplayB');
                if (elB) elB.innerText = `${formatTime(curB)} / -${formatTime(remB)}`;
            }
        }
        setInterval(updateDeckTimes, 400);

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function drawWaveform(canvasId, isPlaying) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const bars = 20;
            const barWidth = canvas.width / bars;
            
            for (let i = 0; i < bars; i++) {
                let height = isPlaying ? (Math.sin(Date.now() / 150 + i) * 4 + 8) : 2;
                ctx.fillStyle = isPlaying ? '#00ffcc' : '#30363d';
                ctx.fillRect(i * barWidth + 1, canvas.height - height, barWidth - 2, height);
            }
        }

        setInterval(() => {
            drawWaveform('waveformA', playerA && playerA.getPlayerState && playerA.getPlayerState() === YT.PlayerState.PLAYING);
            drawWaveform('waveformB', playerB && playerB.getPlayerState && playerB.getPlayerState() === YT.PlayerState.PLAYING);
        }, 120);

        function renderizarBaseDatos() {
            const catContainer = document.getElementById('categoryButtonsContainer');
            const songListContainer = document.getElementById('activeSongList');
            const selectDiv = document.getElementById('selectCategoriaPedido');
            const searchTerm = document.getElementById('quickSearchInput') ? document.getElementById('quickSearchInput').value.toLowerCase().trim() : '';
            
            const estilos = [...new Set(tracks.map(t => t.decade))];
            
            if (!activeCategory || !estilos.includes(activeCategory)) {
                activeCategory = estilos[0] || '';
            }

            let htmlButtons = '';
            let htmlSelect = '';

            estilos.forEach((estilo) => {
                htmlSelect += `<option value="${estilo}">${estilo}</option>`;
                
                let isActive = estilo === activeCategory 
                    ? 'btn-warning text-dark shadow' 
                    : 'btn-dark text-light border-secondary';
                
                let count = tracks.filter(t => t.decade === estilo).length;

                htmlButtons += `
                    <button class="btn btn-sm fw-bold px-3 py-1 ${isActive} d-flex align-items-center gap-2 flex-shrink-0" style="font-size: 0.75rem;" onclick="setActiveCategory('${estilo}')">
                        <i class="bi bi-vinyl"></i> ${estilo} <span class="badge bg-black text-light opacity-75">${count}</span>
                    </button>
                `;
            });

            catContainer.innerHTML = htmlButtons;
            if (!estilos.includes('⭐ Pedidos y Solicitudes')) {
                htmlSelect += `<option value="⭐ Pedidos y Solicitudes">⭐ Pedidos y Solicitudes</option>`;
            }
            selectDiv.innerHTML = htmlSelect;

            let htmlSongs = '';
            
            if (searchTerm !== '') {
                tracks.forEach((track, globalIndex) => {
                    if (track.artist.toLowerCase().includes(searchTerm)) {
                        htmlSongs += generarHtmlCancion(track, globalIndex, true);
                    }
                });
            } else {
                tracks.forEach((track, globalIndex) => {
                    if (track.decade === activeCategory) {
                        htmlSongs += generarHtmlCancion(track, globalIndex, false);
                    }
                });
            }

            if (htmlSongs === '') {
                htmlSongs = `<li class="list-group-item bg-transparent text-center text-muted py-4 border-0">No se encontraron pistas que coincidan con la búsqueda.</li>`;
            }

            songListContainer.innerHTML = htmlSongs;
        }

        function setActiveCategory(estilo) {
            activeCategory = estilo;
            if (document.getElementById('quickSearchInput')) {
                document.getElementById('quickSearchInput').value = '';
            }
            renderizarBaseDatos();
        }

        function generarHtmlCancion(track, globalIndex, showCategory = false) {
            return `
                <li class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between align-items-center py-2 px-3 song-item mb-1 rounded" data-id="${track.id}">
                    <div class="d-flex align-items-center gap-2 overflow-hidden me-2">
                        <input class="form-check-input track-checkbox mt-0" type="checkbox" value="${globalIndex}" style="cursor: pointer;">
                        <div class="song-info text-truncate">
                            <div class="song-title fw-semibold text-truncate" style="font-size: 0.9rem;">${track.artist}</div>
                            <div class="d-flex gap-1 align-items-center mt-1">
                                <span class="song-meta badge bg-secondary bg-opacity-25 text-info border border-secondary font-monospace" style="font-size: 9px;">⚡ ${track.bpm || '?'} BPM</span>
                                ${showCategory ? `<span class="badge bg-warning text-dark font-monospace" style="font-size: 8px;">📂 ${track.decade}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="btn-group btn-group-sm flex-shrink-0">
                        <button class="btn btn-outline-warning text-warning px-2" onclick="previewSong('${track.id}')" title="Test Pre-escucha"><i class="bi bi-headphones"></i></button>
                        <button class="btn btn-outline-danger px-2 fw-bold" onclick="loadVideo('A', '${track.id}')" title="Cargar Deck A">A</button>
                        <button class="btn btn-outline-primary px-2 fw-bold" onclick="loadVideo('B', '${track.id}')" title="Cargar Deck B">B</button>
                        <button class="btn btn-dark text-danger border-secondary px-2" onclick="eliminarCancion(${globalIndex})" title="Borrar"><i class="bi bi-trash"></i></button>
                    </div>
                </li>
            `;
        }

        function eliminarCancion(index) {
            if (confirm("¿Eliminar esta pista de Firebase?")) {
                tracks.splice(index, 1);
                db.ref('tracks').set(tracks);
            }
        }

        function eliminarSeleccionados() {
            const checkboxes = document.querySelectorAll('.track-checkbox:checked');
            if (checkboxes.length === 0) return alert("Selecciona al menos una pista.");

            if (confirm(`¿Eliminar las ${checkboxes.length} pistas seleccionadas?`)) {
                const indicesAEliminar = Array.from(checkboxes).map(cb => parseInt(cb.value));
                tracks = tracks.filter((_, index) => !indicesAEliminar.includes(index));
                db.ref('tracks').set(tracks);
            }
        }

        function buscarEnYouTube() {
            const query = document.getElementById('inputBuscar').value.trim();
            if (query) window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            else alert("Escribe el nombre de un artista o tema.");
        }

        function handleEnterSearch(event) { if (event.key === 'Enter') buscarEnYouTube(); }

        function extraerIDYouTube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        async function autoDetectTitle() {
            const urlInput = document.getElementById('inputUrl').value.trim();
            const nombreInput = document.getElementById('inputNombre');
            if (!urlInput || nombreInput.value.trim() !== '') return;
            
            const videoId = extraerIDYouTube(urlInput);
            if (!videoId) return;

            try {
                const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.title) {
                        nombreInput.value = data.title;
                    }
                }
            } catch (err) {
                console.log("No se pudo autodetectar el título automáticamente.");
            }
        }

        async function agregarPedido() {
            const url = document.getElementById('inputUrl').value.trim();
            let nombre = document.getElementById('inputNombre').value.trim();
            const busqueda = document.getElementById('inputBuscar').value.trim();
            const catSeleccionada = document.getElementById('selectCategoriaPedido').value;
            
            if (!url) return alert("Pega un enlace de YouTube.");
            const videoId = extraerIDYouTube(url);
            if (!videoId) return alert("Enlace de YouTube no válido.");

            if (!nombre) {
                try {
                    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.title) nombre = data.title;
                    }
                } catch (e) {}
                
                if (!nombre) {
                    nombre = busqueda ? busqueda : "Audio Nuevo";
                }
            }

            tracks.push({ id: videoId, artist: nombre, bpm: '?', decade: catSeleccionada });
            db.ref('tracks').set(tracks);

            document.getElementById('inputUrl').value = '';
            document.getElementById('inputNombre').value = '';
            alert("¡Canción guardada en Firebase correctamente!");
        }

        function toggleSoloPreview() {
            isSoloPreviewActive = !isSoloPreviewActive;
            const btn = document.getElementById('soloPreviewBtn');
            if (isSoloPreviewActive) {
                btn.classList.add('active-solo');
            } else {
                btn.classList.remove('active-solo');
            }
            updateVolumes();
        }

        function handleHotCue(deck, padNum) {
            let player = deck === 'A' ? playerA : playerB;
            let cues = deck === 'A' ? hotCuesA : hotCuesB;
            let padEl = document.getElementById(`pad${deck}${padNum}`);

            if (!player || !player.getCurrentTime) return;

            if (cues[padNum] === null) {
                cues[padNum] = player.getCurrentTime();
                padEl.classList.add('active');
            } else {
                player.seekTo(cues[padNum], true);
                player.playVideo();
            }
        }

        function resetHotCues(deck) {
            let cues = deck === 'A' ? hotCuesA : hotCuesB;
            for (let i = 1; i <= 4; i++) {
                cues[i] = null;
                let padEl = document.getElementById(`pad${deck}${i}`);
                if (padEl) padEl.classList.remove('active');
            }
        }

        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '200', width: '200',
                videoId: tracks.length > 0 ? tracks[0].id : 'Gs069dndIYk',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'A') }
            });
            playerB = new YT.Player('playerB', {
                height: '200', width: '200',
                videoId: tracks.length > 1 ? tracks[1].id : 'I_izvAbhExY',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'B') }
            });
            playerPreview = new YT.Player('playerPreview', {
                height: '100', width: '100',
                videoId: tracks.length > 2 ? tracks[2].id : 'xFrGuyw1V8s',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'Preview') }
            });
        }

        function onPlayerReady() { updateVolumes(); }

        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'Preview' ? 'deckPreview' : 'deck' + deck);
            if (deckElement) {
                if (event.data === YT.PlayerState.PLAYING) {
                    deckElement.classList.add('playing-active');
                } else {
                    deckElement.classList.remove('playing-active');
                }
            }
        }

        function previewSong(videoId) {
            if (playerPreview) {
                playerPreview.loadVideoById(videoId);
                playerPreview.playVideo();
            }
        }

        function loadVideo(deck, videoId) {
            let foundTrack = tracks.find(t => t.id === videoId);
            let trackName = foundTrack ? foundTrack.artist : `Video ID: ${videoId}`;

            if (deck === 'A') {
                playerA.cueVideoById(videoId);
                cuePointA = 0;
                resetHotCues('A');
                document.getElementById('cueDisplayA').innerText = `CUE: 0:00`;
                document.getElementById('trackTitleA').innerText = trackName;
                document.getElementById('trackTitleA').title = trackName;
                document.getElementById('timeDisplayA').innerText = '0:00 / -0:00';
            } else {
                playerB.cueVideoById(videoId);
                cuePointB = 0;
                resetHotCues('B');
                document.getElementById('cueDisplayB').innerText = `CUE: 0:00`;
                document.getElementById('trackTitleB').innerText = trackName;
                document.getElementById('trackTitleB').title = trackName;
                document.getElementById('timeDisplayB').innerText = '0:00 / -0:00';
            }

            document.querySelectorAll(`.song-item[data-id="${videoId}"]`).forEach(el => el.classList.add('played'));
        }

        function ejectDeck(deck) {
            if (deck === 'A') {
                if (playerA && playerA.stopVideo) playerA.stopVideo();
                resetHotCues('A');
                document.getElementById('trackTitleA').innerText = '[ DECK A VACÍO ]';
                document.getElementById('trackTitleA').title = 'Sin pista cargada';
                document.getElementById('cueDisplayA').innerText = 'CUE: 0:00';
                document.getElementById('timeDisplayA').innerText = '0:00 / -0:00';
            } else {
                if (playerB && playerB.stopVideo) playerB.stopVideo();
                resetHotCues('B');
                document.getElementById('trackTitleB').innerText = '[ DECK B VACÍO ]';
                document.getElementById('trackTitleB').title = 'Sin pista cargada';
                document.getElementById('cueDisplayB').innerText = 'CUE: 0:00';
                document.getElementById('timeDisplayB').innerText = '0:00 / -0:00';
            }
        }

        function togglePlay(deck) {
            let p = deck === 'A' ? playerA : (deck === 'B' ? playerB : playerPreview);
            if (p && p.getPlayerState) {
                if (p.getPlayerState() === YT.PlayerState.PLAYING) {
                    p.pauseVideo();
                } else {
                    p.playVideo();
                }
            }
        }

        function jumpCue(deck) {
            let player = deck === 'A' ? playerA : playerB;
            if (player && player.seekTo) {
                player.seekTo(0, true);
                player.pauseVideo();
            }
        }

        function updateVolumes() {
            if (!playerA || !playerB || !playerA.setVolume || !playerB.setVolume) return;
            let cf = document.getElementById('crossfader').value;
            let sliderA = document.getElementById('volumeDeckA').value;
            let sliderB = document.getElementById('volumeDeckB').value;

            document.getElementById('volValA').innerText = sliderA + '%';
            document.getElementById('volValB').innerText = sliderB + '%';

            let baseVolA = cf <= 50 ? 100 : 100 - ((cf - 50) * 2);
            let baseVolB = cf >= 50 ? 100 : cf * 2;

            let volA = (baseVolA * sliderA) / 100;
            let volB = (baseVolB * sliderB) / 100;

            if (isSoloPreviewActive) {
                volA = 0;
                volB = 0;
            }

            playerA.setVolume(volA);
            playerB.setVolume(volB);

            if (playerPreview && playerPreview.setVolume) {
                playerPreview.setVolume(isSoloPreviewActive ? 100 : 80);
            }
        }
    </script>
</body>
</html>
