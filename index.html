<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Alegría - DJ Studio Pro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Cabina Sticky Profesional */
        .cabina-sticky {
            position: sticky; top: 0; z-index: 1020;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Vinilos / Decks */
        .deck-vinyl {
            width: 120px; height: 120px; border-radius: 50%; background: #000;
            border: 6px solid #21262d; position: relative; margin: 0 auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.05);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s linear;
        }
        .deck-vinyl.small { width: 75px; height: 75px; border-width: 4px; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }

        .video-container { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; pointer-events: none; }
        .video-container.small { width: 45px; height: 45px; }

        /* Estilo canciones tocadas */
        .song-item.played {
            background-color: #3b1111 !important;
            border-left: 4px solid #f85149 !important;
        }
        .song-item.played .song-title { color: #ff7b72; text-decoration: line-through; }
        .song-item.played .song-meta { color: #ffa198; }

        /* Scrollbars personalizados para listas */
        .playlist-scroll { max-height: 65vh; overflow-y: auto; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="text-light">

    <!-- NAVBAR / HEADER -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary px-3 py-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 text-info fw-bold">
                <i class="bi bi-broadcast"></i> RADIO ALEGRÍA <span class="badge bg-info text-dark fs-6">DJ STUDIO PRO</span>
            </span>
            <span class="text-muted small"><i class="bi bi-cloud-check-fill text-success"></i> Firebase Cloud Conectado</span>
        </div>
    </nav>

    <!-- CABINA DJ STICKY (MEZCLADOR PRINCIPAL) -->
    <div class="cabina-sticky py-3 mb-4">
        <div class="container">
            <div class="row align-items-center justify-content-center g-3 text-center">
                
                <!-- DECK A -->
                <div class="col-md-3 col-4">
                    <div class="card bg-dark border-secondary p-2 shadow">
                        <h6 class="text-danger fw-bold m-0 mb-2">DECK A</h6>
                        <div class="deck-vinyl" id="deckA">
                            <div class="video-container"><div id="playerA"></div></div>
                        </div>
                        <div class="mt-2 d-grid gap-1">
                            <button class="btn btn-danger btn-sm fw-bold" onclick="togglePlay('A')"><i class="bi bi-play-fill"></i> Play / Pause</button>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-light" onclick="setCue('A')">SET CUE</button>
                                <button class="btn btn-warning text-dark fw-bold" onclick="jumpCue('A')">CUE</button>
                            </div>
                            <small id="cueDisplayA" class="text-muted" style="font-size: 10px;">Cue: 0:00</small>
                        </div>
                    </div>
                </div>

                <!-- PREVIEW DECK (PRE-ESCUCHA) -->
                <div class="col-md-2 col-4">
                    <div class="card bg-black border-warning p-2 shadow">
                        <h6 class="text-warning fw-bold m-0 mb-2" style="font-size: 0.85rem;"><i class="bi bi-headphones"></i> PREVIEW</h6>
                        <div class="deck-vinyl small" id="deckPreview">
                            <div class="video-container small"><div id="playerPreview"></div></div>
                        </div>
                        <div class="mt-2 d-grid">
                            <button class="btn btn-warning btn-sm text-dark fw-bold py-1" onclick="togglePlay('Preview')"><i class="bi bi-play-fill"></i> Test</button>
                        </div>
                    </div>
                </div>

                <!-- CROSSFADER & MIXER -->
                <div class="col-md-2 col-4">
                    <div class="card bg-secondary bg-opacity-10 border-secondary p-2 shadow">
                        <h6 class="text-light fw-bold m-0 mb-1" style="font-size: 0.85rem;">CROSSFADER</h6>
                        <span class="text-muted" style="font-size: 10px;">A &lt;=====&gt; B</span>
                        <input type="range" class="form-range my-2" id="crossfader" min="0" max="100" value="50" oninput="updateVolumes()">
                        <div class="d-flex justify-content-between text-muted" style="font-size: 9px;">
                            <span>DECK A</span>
                            <span>DECK B</span>
                        </div>
                    </div>
                </div>

                <!-- DECK B -->
                <div class="col-md-3 col-4">
                    <div class="card bg-dark border-secondary p-2 shadow">
                        <h6 class="text-primary fw-bold m-0 mb-2">DECK B</h6>
                        <div class="deck-vinyl" id="deckB">
                            <div class="video-container"><div id="playerB"></div></div>
                        </div>
                        <div class="mt-2 d-grid gap-1">
                            <button class="btn btn-primary btn-sm fw-bold" onclick="togglePlay('B')"><i class="bi bi-play-fill"></i> Play / Pause</button>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-light" onclick="setCue('B')">SET CUE</button>
                                <button class="btn btn-warning text-dark fw-bold" onclick="jumpCue('B')">CUE</button>
                            </div>
                            <small id="cueDisplayB" class="text-muted" style="font-size: 10px;">Cue: 0:00</small>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL (SETLISTS Y BUSCADOR) -->
    <div class="container mb-5">
        <div class="row g-4">
            
            <!-- COLUMNA IZQUIERDA: SETLIST PRINCIPAL -->
            <div class="col-lg-7">
                <div class="card bg-dark border-secondary shadow">
                    <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-info"><i class="bi bi-music-note-list"></i> Setlist Principal (Cloud)</h5>
                        <button class="btn btn-danger btn-sm fw-bold" onclick="eliminarSeleccionados()">
                            <i class="bi bi-trash3-fill"></i> Borrar Selección
                        </button>
                    </div>
                    <div class="card-body p-2 playlist-scroll">
                        <div class="accordion accordion-flush" id="accordionSetlist">
                            <div class="text-center text-muted py-4">Cargando música desde Firebase...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: BUSCADOR Y GUARDADO INTELIGENTE -->
            <div class="col-lg-5">
                <div class="card bg-dark border-warning shadow">
                    <div class="card-header bg-black border-warning text-warning fw-bold">
                        <i class="bi bi-search"></i> Buscador y Guardado Rápido
                    </div>
                    <div class="card-body">
                        
                        <!-- Paso 1 -->
                        <label class="form-label text-muted small fw-bold">PASO 1: Buscar en YouTube</label>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control bg-black text-light border-secondary" id="inputBuscar" placeholder="Ej: Chayanne Dejaría Todo..." onkeypress="handleEnterSearch(event)">
                            <button class="btn btn-danger" type="button" onclick="buscarEnYouTube()"><i class="bi bi-youtube"></i> Buscar</button>
                        </div>

                        <hr class="border-secondary my-3">

                        <!-- Paso 2 -->
                        <label class="form-label text-muted small fw-bold">PASO 2: Guardar en Categoría</label>
                        <div class="mb-2">
                            <input type="text" class="form-control bg-black text-light border-secondary mb-2" id="inputUrl" placeholder="Pega el enlace de YouTube aquí...">
                            <input type="text" class="form-control bg-black text-light border-secondary mb-2" id="inputNombre" placeholder="Nombre opcional (si está vacío, usa la búsqueda)">
                            <select class="form-select bg-black text-light border-secondary mb-3" id="selectCategoriaPedido">
                                <!-- Se llena dinámicamente -->
                            </select>
                            <button class="btn btn-warning text-dark fw-bold w-100" onclick="agregarPedido()">
                                <i class="bi bi-plus-circle-fill"></i> Añadir a la Base de Datos
                            </button>
                        </div>

                        <div id="tracklist-pedidos" class="mt-3"></div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDgJM6TtDDpGYRrQRKmxKH3S6XBy8TettY",
            authDomain: "mezcla-bad5e.firebaseapp.com",
            databaseURL: "https://mezcla-bad5e-default-rtdb.firebaseio.com",
            projectId: "mezcla-bad5e",
            storageBucket: "mezcla-bad5e.firebasestorage.app",
            messagingSenderId: "852290612625",
            appId: "1:852290612625:web:439cabe2c3494cdbe93e30"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerA, playerB, playerPreview;
        let tracks = [];
        let cuePointA = 0, cuePointB = 0;

        const tracksIniciales = [
            { id: 'Gs069dndIYk', artist: 'Earth, Wind & Fire - September', bpm: 125, decade: '70s Disco' },
            { id: 'I_izvAbhExY', artist: 'Bee Gees - Stayin\' Alive', bpm: 104, decade: '70s Disco' },
            { id: 'djV11Xbc914', artist: 'A-ha - Take On Me', bpm: 169, decade: '80s Pop' },
            { id: 'Zi_XLOBDo_Y', artist: 'Michael Jackson - Billie Jean', bpm: 117, decade: '80s Pop' },
            { id: 'HEXWRTEbj1I', artist: 'Haddaway - What Is Love', bpm: 124, decade: '90s Eurodance' },
            { id: 'PWgvGjAhvIw', artist: 'Outkast - Hey Ya!', bpm: 160, decade: '2000s Club' },
            { id: 'ZbZSe6N_BXs', artist: 'Pharrell Williams - Happy', bpm: 160, decade: 'Actualidad' },
            { id: 'qGKrc3A6HHM', artist: 'Daddy Yankee - Gasolina', bpm: 96, decade: 'Reggaeton' },
            { id: 'YXnjy5YlDwk', artist: 'Marc Anthony - Vivir Mi Vida', bpm: 105, decade: 'Tropical y Salsa' },
            { id: 'h9tXY5j3NY8', artist: 'Chayanne - Dejaría Todo', bpm: 80, decade: 'Baladas y Románticos' }
        ];

        // Sincronización en tiempo real con Firebase
        db.ref('tracks').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                tracks = Object.values(data);
            } else {
                tracks = tracksIniciales;
                db.ref('tracks').set(tracksIniciales);
            }
            renderizarBaseDatos();
        });

        function renderizarBaseDatos() {
            const accordionDiv = document.getElementById('accordionSetlist');
            const selectDiv = document.getElementById('selectCategoriaPedido');
            const estilos = [...new Set(tracks.map(t => t.decade))];
            let htmlAccordion = '';
            let htmlSelect = '';

            estilos.forEach((estilo, index) => {
                let catId = 'cat-' + index;
                let isExpanded = index === 0 ? 'true' : 'false';
                let showClass = index === 0 ? 'show' : '';
                
                htmlSelect += `<option value="${estilo}">${estilo}</option>`;

                htmlAccordion += `
                    <div class="accordion-item bg-dark border-secondary mb-2 rounded overflow-hidden">
                        <h2 class="accordion-header" id="heading-${catId}">
                            <button class="accordion-button bg-black text-light fw-bold ${index !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${catId}" aria-expanded="${isExpanded}" aria-controls="collapse-${catId}">
                                <i class="bi bi-folder2-open text-info me-2"></i> ${estilo}
                            </button>
                        </h2>
                        <div id="collapse-${catId}" class="accordion-collapse collapse ${showClass}" aria-labelledby="heading-${catId}" data-bs-parent="#accordionSetlist">
                            <div class="accordion-body p-0">
                                <ul class="list-group list-group-flush">
                `;

                tracks.forEach((track, globalIndex) => {
                    if (track.decade === estilo) {
                        htmlAccordion += generarHtmlCancion(track, globalIndex);
                    }
                });

                htmlAccordion += `
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            });

            accordionDiv.innerHTML = htmlAccordion;
            selectDiv.innerHTML = htmlSelect + `<option value="Pedidos Temporales">⭐ Lista Temporal de Pedidos</option>`;
        }

        function generarHtmlCancion(track, globalIndex) {
            return `
                <li class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between align-items-center py-2 px-3 song-item" data-id="${track.id}">
                    <div class="d-flex align-items-center gap-2 overflow-hidden me-2">
                        <input class="form-check-input track-checkbox mt-0" type="checkbox" value="${globalIndex}" style="cursor: pointer;">
                        <div class="song-info text-truncate">
                            <div class="song-title fw-semibold text-truncate" style="font-size: 0.9rem;">${track.artist}</div>
                            <span class="song-meta badge bg-secondary bg-opacity-25 text-info border border-secondary" style="font-size: 10px;">⚡ ${track.bpm || '?'} BPM</span>
                        </div>
                    </div>
                    <div class="btn-group btn-group-sm flex-shrink-0">
                        <button class="btn btn-outline-warning text-warning" onclick="previewSong('${track.id}')" title="Test Pre-escucha"><i class="bi bi-headphones"></i></button>
                        <button class="btn btn-outline-danger" onclick="loadVideo('A', '${track.id}')" title="Cargar Deck A">A</button>
                        <button class="btn btn-outline-primary" onclick="loadVideo('B', '${track.id}')" title="Cargar Deck B">B</button>
                        <button class="btn btn-dark text-danger border-secondary" onclick="eliminarCancion(${globalIndex})" title="Borrar"><i class="bi bi-trash"></i></button>
                    </div>
                </li>
            `;
        }

        function eliminarCancion(index) {
            if (confirm("¿Estás seguro de eliminar esta canción?")) {
                tracks.splice(index, 1);
                db.ref('tracks').set(tracks);
            }
        }

        function eliminarSeleccionados() {
            const checkboxes = document.querySelectorAll('.track-checkbox:checked');
            if (checkboxes.length === 0) return alert("Selecciona al menos una canción.");

            if (confirm(`¿Eliminar ${checkboxes.length} canciones seleccionadas?`)) {
                const indicesAEliminar = Array.from(checkboxes).map(cb => parseInt(cb.value));
                tracks = tracks.filter((_, index) => !indicesAEliminar.includes(index));
                db.ref('tracks').set(tracks);
            }
        }

        function buscarEnYouTube() {
            const query = document.getElementById('inputBuscar').value.trim();
            if (query) window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
            else alert("Escribe el nombre de una canción para buscar.");
        }

        function handleEnterSearch(event) { if (event.key === 'Enter') buscarEnYouTube(); }

        function extraerIDYouTube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }

        function agregarPedido() {
            const url = document.getElementById('inputUrl').value.trim();
            let nombre = document.getElementById('inputNombre').value.trim();
            const busqueda = document.getElementById('inputBuscar').value.trim();
            const catSeleccionada = document.getElementById('selectCategoriaPedido').value;
            
            if (!url) return alert("Pega un enlace de YouTube.");
            const videoId = extraerIDYouTube(url);
            if (!videoId) return alert("Enlace de YouTube inválido.");

            if (!nombre) {
                nombre = busqueda ? busqueda : "Audio Nuevo";
            }

            if (catSeleccionada === 'Pedidos Temporales') {
                const contenedor = document.getElementById('tracklist-pedidos');
                contenedor.innerHTML = `
                    <div class="alert alert-warning py-2 mb-2 d-flex justify-content-between align-items-center">
                        <span class="small fw-bold text-truncate me-2">${nombre}</span>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-warning text-dark" onclick="previewSong('${videoId}')"><i class="bi bi-headphones"></i></button>
                            <button class="btn btn-danger" onclick="loadVideo('A', '${videoId}')">A</button>
                            <button class="btn btn-primary" onclick="loadVideo('B', '${videoId}')">B</button>
                        </div>
                    </div>
                ` + contenedor.innerHTML;
            } else {
                tracks.push({ id: videoId, artist: nombre, bpm: '?', decade: catSeleccionada });
                db.ref('tracks').set(tracks);
            }

            document.getElementById('inputUrl').value = '';
            document.getElementById('inputNombre').value = '';
        }

        // YouTube API & DJ Controls
        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '200', width: '200',
                videoId: tracks.length > 0 ? tracks[0].id : 'Gs069dndIYk',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'A') }
            });
            playerB = new YT.Player('playerB', {
                height: '200', width: '200',
                videoId: tracks.length > 1 ? tracks[1].id : 'I_izvAbhExY',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'B') }
            });
            playerPreview = new YT.Player('playerPreview', {
                height: '100', width: '100',
                videoId: tracks.length > 2 ? tracks[2].id : 'xFrGuyw1V8s',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => onStateChange(e, 'Preview') }
            });
        }

        function onPlayerReady() { updateVolumes(); }

        function onStateChange(event, deck) {
            let deckElement = document.getElementById(deck === 'Preview' ? 'deckPreview' : 'deck' + deck);
            if (deckElement && event.data === YT.PlayerState.PLAYING) deckElement.classList.add('spinning');
            else if (deckElement) deckElement.classList.remove('spinning');
        }

        function previewSong(videoId) {
            if (playerPreview) {
                playerPreview.loadVideoById(videoId);
                playerPreview.playVideo();
            }
        }

        function loadVideo(deck, videoId) {
            if (deck === 'A') {
                playerA.cueVideoById(videoId);
                cuePointA = 0;
                document.getElementById('cueDisplayA').innerText = `Cue: 0:00`;
            } else {
                playerB.cueVideoById(videoId);
                cuePointB = 0;
                document.getElementById('cueDisplayB').innerText = `Cue: 0:00`;
            }

            // Marcar en rojo las ya tocadas
            document.querySelectorAll(`.song-item[data-id="${videoId}"]`).forEach(el => el.classList.add('played'));
        }

        function togglePlay(deck) {
            let p = deck === 'A' ? playerA : (deck === 'B' ? playerB : playerPreview);
            if (p && p.getPlayerState && p.getPlayerState() === 1) p.pauseVideo();
            else if (p && p.playVideo) p.playVideo();
        }

        function setCue(deck) {
            let player = deck === 'A' ? playerA : playerB;
            if (player && player.getCurrentTime) {
                let time = player.getCurrentTime();
                if (deck === 'A') {
                    cuePointA = time;
                    document.getElementById('cueDisplayA').innerText = `Cue: ${formatTime(time)}`;
                } else {
                    cuePointB = time;
                    document.getElementById('cueDisplayB').innerText = `Cue: ${formatTime(time)}`;
                }
            }
        }

        function jumpCue(deck) {
            let player = deck === 'A' ? playerA : playerB;
            let time = deck === 'A' ? cuePointA : cuePointB;
            if (player && player.seekTo) {
                player.seekTo(time, true);
                player.pauseVideo();
            }
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateVolumes() {
            if (!playerA || !playerB || !playerA.setVolume || !playerB.setVolume) return;
            let f = document.getElementById('crossfader').value;
            playerA.setVolume(f <= 50 ? 100 : 100 - ((f - 50) * 2));
            playerB.setVolume(f >= 50 ? 100 : f * 2);
            if (playerPreview && playerPreview.setVolume) playerPreview.setVolume(80);
        }
    </script>
</body>
</html>
